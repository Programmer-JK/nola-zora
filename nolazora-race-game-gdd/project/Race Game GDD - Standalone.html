인 짧은 감속',cond:'낮은 확률'},\n  {c:'random',name:'미러 매치',eff:'무작위 2인 스탯 순간 교환',cond:'우주 트랙 한정'},\n  // 환경 이벤트 (env)\n  {c:'env',name:'날씨 급변',eff:'레이스 중 날씨 1회 전환',cond:'중반 확률 발동'},\n  {c:'env',name:'파도 밀림',eff:'해변 구간 전원 순간 감속',cond:'해변 트랙'},\n  {c:'env',name:'워프홀',eff:'통과 캐릭터 순간이동(전진)',cond:'우주 트랙'},\n  {c:'env',name:'모래폭풍 벽',eff:'구간 전체 속도 -12%',cond:'황사 조건'},\n  {c:'env',name:'빙하 균열',eff:'라인 갈라져 우회 발생',cond:'빙판 트랙'},\n  {c:'env',name:'화산 연기',eff:'시야 차단 + 열피해',cond:'화산+폭염'},\n  {c:'env',name:'폭우 범람',eff:'저지대 구간 감속 심화',cond:'비/폭풍'},\n  {c:'env',name:'상승 온천',eff:'분출 발판으로 도약 가속',cond:'화산/동굴'},\n  {c:'env',name:'낙엽 폭풍',eff:'숲 구간 시야·접지 저하',cond:'숲+강풍'},\n  {c:'env',name:'유성우',eff:'무작위 지점 낙하 장애물',cond:'우주/하늘'},\n  // 캐릭터 이벤트 (char)\n  {c:'char',name:'라이벌 각성',eff:'특정 라이벌 근접 시 가속 +12%',cond:'지정 라이벌 페어'},\n  {c:'char',name:'약점 노출',eff:'약점 트랙/날씨서 추가 감속',cond:'약점 조건 충족'},\n  {c:'char',name:'팬 서비스',eff:'홈 트랙서 STA 회복 + 버프',cond:'선호 트랙'},\n  {c:'char',name:'집중 모드',eff:'STA 낮을 때 TEC +2 보정',cond:'스태미나 30% 이하'},\n  {c:'char',name:'멘탈 붕괴',eff:'연속 추월당하면 가속 -10%',cond:'3연속 순위 하락'},\n  {c:'char',name:'승부욕',eff:'선두와 근접 시 액티브 위력↑',cond:'2위에서 1위 추격'},\n  {c:'char',name:'컨디션 난조',eff:'라운드 시작 시 미세 디버프',cond:'낮은 확률 개별'},\n  {c:'char',name:'각성 폼',eff:'최종 라운드 전 능력 소폭 상승',cond:'4라운드 진입'},\n  {c:'char',name:'페어 플레이',eff:'충돌 이벤트 회피 확률↑',cond:'TEC 높은 캐릭터'},\n];\n\n/* =================================================================\n   SECTION HTML\n   ================================================================= */\nconst rarName={common:'COMMON',rare:'RARE',epic:'EPIC',legendary:'LEGENDARY'};\nconst evName={good:'좋은 이벤트',bad:'나쁜 이벤트',random:'랜덤 이벤트',env:'환경 이벤트',char:'캐릭터 이벤트'};\nconst evColor={good:'good',bad:'bad',random:'info',env:'gold',char:'info'};\n\nfunction statBars(s){\n  return Object.entries(s).map(([k,v])=>`\n    <div class=\"stat\"><span class=\"lbl\">${k}<\u002Fspan>\n    <div class=\"bar\"><i style=\"width:${v*10}%\"><\u002Fi><\u002Fdiv>\n    <span class=\"val\">${v}<\u002Fspan><\u002Fdiv>`).join('');\n}\n\nconst sections = [\n// ---------- 1 ----------\n`<section id=\"s1\"><div class=\"sec-head\"><div class=\"sec-num\">01<\u002Fdiv>\n<div><h2>게임 개요<\u002Fh2><div class=\"sub\">Game Overview<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">RACE GAME은 놀아조라 플랫폼에서 즐기는 <b>실시간 예측 베팅 레이싱 게임<\u002Fb>입니다. 플레이어는 직접 달리지 않습니다. 대신 캐릭터의 능력, 트랙, 날씨, 거리, 이벤트를 분석해 <b>가장 기대값이 높은 베팅<\u002Fb>을 하고, 레이스 도중에도 라이브 베팅과 미션(Contract)으로 판을 뒤집습니다.<\u002Fp>\n<div class=\"grid g4\">\n  <div class=\"mini\"><span class=\"k\">PLAY TIME<\u002Fspan><span class=\"v\">15<small> min<\u002Fsmall><\u002Fspan><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">PLAYERS<\u002Fspan><span class=\"v\">2~8<small> 명<\u002Fsmall><\u002Fspan><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">ROUNDS<\u002Fspan><span class=\"v\">4<small> × 3min<\u002Fsmall><\u002Fspan><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">START CHIP<\u002Fspan><span class=\"v\">700<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 게임 소개<\u002Fh3>\n  <p>레이스는 완전 랜덤이 아닙니다. 12명의 캐릭터는 각자 고유 능력·선호 트랙·선호 날씨·패시브·액티브를 가지며, 결과는 이 정보들과 실시간 이벤트의 상호작용으로 결정됩니다. 관전은 스포츠 중계처럼, 베팅은 카드 게임처럼 느껴지도록 설계되었습니다.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 게임 목표<\u002Fh3>\n  <p>4개 라운드 동안 Chip을 최대한 불립니다. 사전 베팅 + 라이브 베팅 + Contract(미션)의 조합으로 최종 Chip이 가장 많은 플레이어가 승리합니다. Chip은 순위가 아니라 <b>선택의 정확도<\u002Fb>로 벌립니다.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<h4 style=\"font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:8px 0 12px\">◆ 핵심 재미<\u002Fh4>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">예측<\u002Fspan><span class=\"v\" style=\"font-size:15px\">READ THE RACE<\u002Fspan><p class=\"muted\" style=\"margin:10px 0 0;font-size:16px\">정보를 읽고 결과를 추론하는 쾌감<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">역전<\u002Fspan><span class=\"v\" style=\"font-size:15px\">LIVE COMEBACK<\u002Fspan><p class=\"muted\" style=\"margin:10px 0 0;font-size:16px\">라이브 베팅으로 판을 뒤집는 스릴<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">전략<\u002Fspan><span class=\"v\" style=\"font-size:15px\">RISK & VALUE<\u002Fspan><p class=\"muted\" style=\"margin:10px 0 0;font-size:16px\">기대값과 리스크를 저울질하는 두뇌 싸움<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\"><b>차별점.<\u002Fb> 일반 레이싱 게임이 조작 실력을 겨룬다면, RACE GAME은 <b>정보 분석과 베팅 심리<\u002Fb>를 겨룹니다. \"운\"이 아니라 \"기대값이 가장 높은 선택\"을 한 사람이 이기는 전략 게임입니다. 하위권 한정 라이브 베팅으로 역전 서사가 매 레이스마다 생성됩니다.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 2 (접근성) ----------\n`<section id=\"s2\"><div class=\"sec-head\"><div class=\"sec-num\">02<\u002Fdiv>\n<div><h2>쉽게 즐기기 (접근성)<\u002Fh2><div class=\"sub\">Easy Onboarding · Accessibility<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">파티 게임에서 룰 설명이 길어지면 분위기가 식습니다. RACE GAME은 전략적 깊이를 유지하되, <b>처음 앉은 사람도 룰 설명 없이 첫 30초 안에 베팅하고 즐길 수 있어야<\u002Fb> 합니다. 접근성은 부가 기능이 아니라 이 게임의 1급 설계 요구사항입니다.<\u002Fp>\n<div class=\"note info\"><b>설계 원칙 — 입구는 넓게, 천장은 높게.<\u002Fb> 분석의 깊이를 <u>없애지 않고<\u002Fu> 숨깁니다. 초보는 직관(배지·별점)만 보고 즐기고, 고수는 그 배지 뒤의 실제 수치를 읽어 밸류를 사냥합니다. <b>같은 화면, 다른 독해.<\u002Fb><\u002Fdiv>\n\n<h4 style=\"font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:8px 0 12px\">◆ 한 테이블, 세 가지 깊이<\u002Fh4>\n<div class=\"grid g3\">\n  <div class=\"panel\" style=\"margin:0\"><h3>1층 · 감으로<\u002Fh3><p>\"쟤 멋있으니까 걸래.\" 캐릭터 개성·비주얼만 보고 베팅해도 재밌어야 합니다. 틀려도 라이브 역전으로 끝까지 살아남아 분위기가 안 죽습니다.<\u002Fp><div class=\"chips\"><span class=\"chip\">룰 몰라도 OK<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"panel\" style=\"margin:0\"><h3>2층 · 추천 따라<\u002Fh3><p>게임이 \"이 트랙 잘함 / 오늘 날씨 최악\"을 아이콘으로 알려주고, 추천 픽 3개 중 원탭. 숫자 없이 유리/불리가 한눈에 들어옵니다.<\u002Fp><div class=\"chips\"><span class=\"chip info\">원탭 추천<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"panel\" style=\"margin:0\"><h3>3층 · 분석해서<\u002Fh3><p>고수는 배지 뒤의 실제 능력치·날씨 시너지·약점을 읽어 저평가 밸류를 잡습니다. 여기가 게임의 천장이자 재플레이 동력.<\u002Fp><div class=\"chips\"><span class=\"chip gold\">밸류 사냥<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h4 style=\"font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:24px 0 12px\">◆ 정보를 '숫자'에서 '직관'으로<\u002Fh4>\n<div class=\"grid g2\">\n  <div class=\"panel\" style=\"margin:0;border-left:6px solid var(--bad)\">\n    <h3 style=\"color:var(--bad)\">✕ BEFORE — 숫자 나열 (초보 이탈)<\u002Fh3>\n    <div class=\"mini\" style=\"background:var(--bg2)\">\n      <span class=\"v\" style=\"font-size:13px\">🔥 엠버<\u002Fspan>\n      <p class=\"muted\" style=\"margin:10px 0 0;font-size:16px\">SPD 7 · ACC 6 · STA 8 · LCK 5 · TEC 6 · 화산 적성 +15% · 폭염 +13% · 빙판 -15% · 열내성 패시브 · 액티브 플레어러시…<\u002Fp>\n    <\u002Fdiv>\n    <p class=\"muted small\" style=\"margin:10px 0 0\">\"뭘 봐야 하지?\" → 30초 안에 판단 불가 → 대충 찍거나 이탈.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"panel\" style=\"margin:0;border-left:6px solid var(--good)\">\n    <h3 style=\"color:var(--good)\">✓ AFTER — 배지 · 별점 (0초 판독)<\u002Fh3>\n    <div class=\"mini\" style=\"background:var(--bg2)\">\n      <span class=\"v\" style=\"font-size:13px\">🔥 엠버<\u002Fspan>\n      <div style=\"margin:10px 0 8px\">\n        <div class=\"stat\" style=\"margin:5px 0\"><span class=\"lbl\">속도<\u002Fspan><div class=\"bar\"><i style=\"width:70%\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\" style=\"margin:5px 0\"><span class=\"lbl\">체력<\u002Fspan><div class=\"bar\"><i style=\"width:80%\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"chips\"><span class=\"chip good\">🔥 이 트랙 지배<\u002Fspan><span class=\"chip bad\">💀 빙판 약함<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"muted small\" style=\"margin:10px 0 0\">\"오늘 화산이네, 엠버 좋겠다\" → 즉시 이해 → 바로 베팅.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h4 style=\"font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:24px 0 12px\">◆ 접근성 장치<\u002Fh4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>장치<\u002Fth><th>동작<\u002Fth><th>효과<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td><b>배지 · 별점 UI<\u002Fb><\u002Ftd><td>능력치를 숫자 대신 별점 바 + 상황 아이콘(🔥 강함 / 💀 약함 / ⭐ 컨디션)으로.<\u002Ftd><td>읽는 데 0초. 룰 설명 불필요.<\u002Ftd><\u002Ftr>\n<tr><td><b>한 줄 이유<\u002Fb><\u002Ftd><td>추천 픽에 \"엠버는 화산을 지배해요\" 같은 근거 한 줄 자동 표시.<\u002Ftd><td>왜 유리한지 학습 → 자연스러운 튜토리얼.<\u002Ftd><\u002Ftr>\n<tr><td><b>원탭 추천 베팅<\u002Fb><\u002Ftd><td>기대값 상위 3픽을 카드로 제시, 탭 한 번으로 베팅 확정.<\u002Ftd><td>고민 없이 첫 베팅. 결정 마비 방지.<\u002Ftd><\u002Ftr>\n<tr><td><b>첫 판 간이 모드<\u002Fb><\u002Ftd><td>1라운드는 단승만 + 간단 Contract만 노출. 라이브·고난도는 잠금.<\u002Ftd><td>정보량 급감 → 첫인상이 가볍고 경쾌.<\u002Ftd><\u002Ftr>\n<tr><td><b>점진적 공개<\u002Fb><\u002Ftd><td>라운드가 갈수록 라이브 베팅 · 복합 Contract · 심화 지표를 하나씩 오픈.<\u002Ftd><td>실력이 늘 시점에 맞춰 깊이 등장.<\u002Ftd><\u002Ftr>\n<tr><td><b>관전 참여<\u002Fb><\u002Ftd><td>룰을 몰라도 응원 · 리액션 · 이모트로 참여. Display가 서사를 대신 설명.<\u002Ftd><td>베팅 안 해도 파티에 낀다 → 아무도 소외 안 됨.<\u002Ftd><\u002Ftr>\n<tr><td><b>스킵 가능한 심화<\u002Fb><\u002Ftd><td>수치·확률 상세는 '자세히' 토글 뒤로. 기본 화면은 항상 단순.<\u002Ftd><td>초보는 안 보이고, 고수는 언제든 꺼냄.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n\n<h4 style=\"font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:24px 0 12px\">◆ 첫 30초 진입 흐름<\u002Fh4>\n<div class=\"panel\"><div class=\"flow\"><div class=\"flow-row\">\n  <div class=\"flow-node start\"><span class=\"t\">0s 착석<\u002Fspan><span class=\"d\">캐릭터 카드에 배지 한눈<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">10s 추천<\u002Fspan><span class=\"d\">\"추천 3픽\" 카드 등장<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">15s 원탭<\u002Fspan><span class=\"d\">마음에 드는 픽 탭 → 베팅 완료<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">30s 관전<\u002Fspan><span class=\"d\">레이스 시작, 내 픽 응원<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node end\"><span class=\"t\">다음 판<\u002Fspan><span class=\"d\">\"어 재밌네\" → 스스로 분석 시작<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"note good\"><b>파티게임 체크.<\u002Fb> 신규 유저가 <b>룰 설명 0줄로 첫 라운드를 완주<\u002Fb>하고, 3라운드째엔 스스로 배지를 읽으며 베팅하도록 만드는 것이 목표입니다. 복잡함은 원하는 사람만 파고들고, 나머지는 분위기를 타고 즐깁니다.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 2 ----------\n`<section id=\"s3\"><div class=\"sec-head\"><div class=\"sec-num\">03<\u002Fdiv>\n<div><h2>게임 진행<\u002Fh2><div class=\"sub\">Game Flow<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">한 게임은 <b>4개 라운드<\u002Fb>로 구성되며, 각 라운드는 준비 → 사전 베팅 → 레이스(+라이브 베팅) → 정산의 흐름을 반복합니다. <b>한 라운드 ≈ 3분 (베팅 30초 + 레이스 150초)<\u002Fb><\u002Fp>\n<div class=\"panel\"><h3>▶ 전체 흐름 (Flow Chart)<\u002Fh3>\n<div class=\"flow\">\n  <div class=\"flow-row\"><div class=\"flow-node start\"><span class=\"t\">GAME START<\u002Fspan><span class=\"d\">방 입장 · Display 지정 · Chip 700 지급<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"flow-arrow\">▼<\u002Fdiv>\n  <div class=\"flow-row\">\n    <div class=\"flow-node\"><span class=\"t\">ROUND 1~4<\u002Fspan><span class=\"d\">라운드 반복 (약 3분)<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"flow-arrow\">▼  R 루프<\u002Fdiv>\n  <div class=\"flow-row\">\n    <div class=\"flow-node\"><span class=\"t\">① 준비<\u002Fspan><span class=\"d\">트랙·날씨·출전 캐릭터·배당 공개<\u002Fspan><\u002Fdiv>\n    <div class=\"flow-node\"><span class=\"t\">② 사전 베팅<\u002Fspan><span class=\"d\">~30초. Bet + Contract 선택<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"flow-arrow\">▼<\u002Fdiv>\n  <div class=\"flow-row\">\n    <div class=\"flow-node\"><span class=\"t\">③ 레이스<\u002Fspan><span class=\"d\">~2분 30초. 체크포인트마다 라이브 베팅(전 캐릭터, 순위별 배당)<\u002Fspan><\u002Fdiv>\n    <div class=\"flow-node\"><span class=\"t\">④ 정산<\u002Fspan><span class=\"d\">순위 확정 · 배당 지급 · Contract 판정<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"flow-arrow\">▼  ×4 종료 후<\u002Fdiv>\n  <div class=\"flow-row\"><div class=\"flow-node end\"><span class=\"t\">GAME END<\u002Fspan><span class=\"d\">최종 Chip 합산 · 순위 · MVP 발표<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<h3 style=\"margin-top:28px\">▶ 한 레이스의 상세 타임라인 (150초 = 2분 30초)<\u002Fh3>\n<p style=\"color:var(--muted);margin-bottom:20px\"><b>※ 개발 명세:<\u002Fb> 각 구간의 능력치 가중치, 이벤트 발동률, AI 판정식을 아래에 기술합니다. 이 수치 그대로 구현하면 게임 로직이 완성됩니다.<\u002Fp>\n\n<div style=\"display:grid;gap:14px;margin-bottom:28px\">\n<div style=\"border:3px solid var(--gold);padding:14px;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))\">\n<h4 style=\"color:var(--gold);margin:0 0 10px\">0:00~0:10 — 출발 & 초반 진입<\u002Fh4>\n<table class=\"tbl\" style=\"font-size:15px\">\n<tr><td style=\"width:25%;font-weight:bold\">거리<\u002Ftd><td>전체 6~8%<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력치 비중<\u002Ftd><td>SPD(40%) + ACC(35%) + STA(15%) + LCK(10%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">키 패시브<\u002Ftd><td>• <b>볼트:<\u002Fb> 스타트 대시 +30% (최우선)<br/>• 다른 캐릭터: 기본값<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">AI 판정식<\u002Ftd><td><code style=\"font-size:13px\">초기순위 = Σ(SPD×0.4 + ACC×0.35 + LCK×0.15) + 난수(-5~+5)<\u002Fcode><br/>패시브 보너스 추가<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">이벤트<\u002Ftd><td>발생률 5% (낮음) / 초반 스턴만 가능<\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div style=\"border:3px solid var(--info);padding:14px;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))\">\n<h4 style=\"color:var(--info);margin:0 0 10px\">0:10~0:35 — 초전반부 & CP1<\u002Fh4>\n<table class=\"tbl\" style=\"font-size:15px\">\n<tr><td style=\"width:25%;font-weight:bold\">거리<\u002Ftd><td>전체 15%<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력치 비중<\u002Ftd><td>SPD(45%) + TEC(20%) + STA(20%) + ACC(15%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">코너 메커닉<\u002Ftd><td>TEC가 높을수록 코너 감속 최소화<br/>TEC ≤5: 코너당 -8% 속도 / TEC ≥8: 무감속<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">AI 판정식<\u002Ftd><td><code style=\"font-size:13px\">현재_속도 = 기본_속도 × (1 + 트랙_보너스) × (1 - 코너_페널티)<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">이벤트<\u002Ftd><td>발생률 12% / 좋은(7%) vs 나쁜(5%)<br/>예) \"코너 컷!\" vs \"나무 부딪힘!\"<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">CP1 도달(0:35)<\u002Ftd><td><b>라이브 베팅 오픈 ↔ 4위 이하만 대상<\u002Fb><\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div style=\"border:3px solid var(--good);padding:14px;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))\">\n<h4 style=\"color:var(--good);margin:0 0 10px\">0:35~1:10 — 중전반부 & CP2<\u002Fh4>\n<table class=\"tbl\" style=\"font-size:15px\">\n<tr><td style=\"width:25%;font-weight:bold\">거리<\u002Ftd><td>전체 28%<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력치 비중<\u002Ftd><td>STA(40%) + SPD(25%) + TEC(20%) + LCK(15%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">스태미나 시스템<\u002Ftd><td>• 매 5초마다 STA 1씩 소모<br/>• STA 0 도달 시 최고속 60%로 제한<br/>• <b>세이지 패시브:<\u002Fb> STA 0이어도 90% 유지<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력 활용<\u002Ftd><td>액티브 능력 발동 가능 (1회/레이스)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">이벤트<\u002Ftd><td>발생률 18% / 좋은(10%) vs 나쁜(8%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">CP2 도달(1:10)<\u002Ftd><td><b>라이브 베팅 재오픈 ↔ 3위 이하만 대상<\u002Fb><\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div style=\"border:3px solid var(--bad);padding:14px;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))\">\n<h4 style=\"color:var(--bad);margin:0 0 10px\">1:10~1:50 — 중후반부 & CP3 (역전의 황금시간)<\u002Fh4>\n<table class=\"tbl\" style=\"font-size:15px\">\n<tr><td style=\"width:25%;font-weight:bold\">거리<\u002Ftd><td>전체 35%<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력치 비중<\u002Ftd><td>STA(50%) + LCK(20%) + TEC(15%) + SPD(15%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">역전 메커닉<\u002Ftd><td><b>이벤트 발생률 25% (최고)<\u002Fb><br/>LCK 높은 캐릭터가 이벤트 수혜<br/>상위권도 나쁜 이벤트 타격 가능<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">주요 이벤트<\u002Ftd><td>\"슬립스트림!\" → +8% 속도<br/>\"타이어 펑크!\" → -15% 10초<br/>\"지름길!\" → +5% 거리 이득<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">CP3 도달(1:50)<\u002Ftd><td><b>마지막 라이브 베팅 오픈 ↔ 5위 이하만 대상<\u002Fb><\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">AI 판정: 상위권<\u002Ftd><td>보수적으로 2~3초 버티기<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">AI 판정: 하위권<\u002Ftd><td><b>머드 패시브:<\u002Fb> \"언더독\" +30% 가속<\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div style=\"border:3px solid var(--purple);padding:14px;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))\">\n<h4 style=\"color:var(--purple);margin:0 0 10px\">1:50~2:20 — 막판 & CP4<\u002Fh4>\n<table class=\"tbl\" style=\"font-size:15px\">\n<tr><td style=\"width:25%;font-weight:bold\">거리<\u002Ftd><td>전체 18%<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력치 비중<\u002Ftd><td>SPD(35%) + STA(35%) + TEC(20%) + LCK(10%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">순위 고착<\u002Ftd><td>이벤트 발생률 14% (낮음)<br/>순위 변동 어려워짐<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">CP4 도달(2:20)<\u002Ftd><td>라이브 베팅 종료<br/>순위 거의 확정<\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div style=\"border:3px solid var(--legendary);padding:14px;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))\">\n<h4 style=\"color:var(--black);margin:0 0 10px\">2:20~2:30 — 스퍼트 & 골인<\u002Fh4>\n<table class=\"tbl\" style=\"font-size:15px\">\n<tr><td style=\"width:25%;font-weight:bold\">거리<\u002Ftd><td>전체 8% (마지막 200m)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">능력치 비중<\u002Ftd><td>SPD(60%) + STA(30%) + ACC(10%)<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">순위 변동<\u002Ftd><td><b>최대 1~2계단만 가능<\u002Fb><br/>대부분 순위 고정<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">액티브 능력<\u002Ftd><td>• <b>록시:<\u002Fb> \"롤링 스퍼트\" +28%<br/>• <b>게일:<\u002Fb> \"다이브\" 최고속<br/>• <b>세이지:<\u002Fb> STA 기반 부스트<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-weight:bold\">골인<\u002Ftd><td>최종 순위 확정 & 페이스 연출<\u002Ftd><\u002Ftr>\n<\u002Ftable>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3>▶ 타임라인 요약표<\u002Fh3>\n<table class=\"tbl\">\n<tr style=\"background:var(--panel2)\"><th>구간<\u002Fth><th>시간<\u002Fth><th>거리%<\u002Fth><th>우위 능력치<\u002Fth><th>이벤트율<\u002Fth><th>주요 특징<\u002Fth><\u002Ftr>\n<tr><td><b>출발<\u002Fb><\u002Ftd><td>0~10s<\u002Ftd><td>6~8%<\u002Ftd><td>SPD, ACC<\u002Ftd><td>5%<\u002Ftd><td>볼트 부스트 존<\u002Ftd><\u002Ftr>\n<tr><td><b>초전반<\u002Fb><\u002Ftd><td>10~35s<\u002Ftd><td>15%<\u002Ftd><td>SPD, TEC<\u002Ftd><td>12%<\u002Ftd><td><b>CP1<\u002Fb>, 라이브 시작<\u002Ftd><\u002Ftr>\n<tr><td><b>중전반<\u002Fb><\u002Ftd><td>35~70s<\u002Ftd><td>28%<\u002Ftd><td>STA, TEC<\u002Ftd><td>18%<\u002Ftd><td>스태미나 싸움, <b>CP2<\u002Fb><\u002Ftd><\u002Ftr>\n<tr style=\"background:var(--panel2)\"><td><b>중후반<\u002Fb><\u002Ftd><td>70~110s<\u002Ftd><td>35%<\u002Ftd><td>STA, LCK<\u002Ftd><td>25%<\u002Ftd><td><b>역전의 시간<\u002Fb>, <b>CP3<\u002Fb><\u002Ftd><\u002Ftr>\n<tr><td><b>막판<\u002Fb><\u002Ftd><td>110~140s<\u002Ftd><td>18%<\u002Ftd><td>SPD, STA<\u002Ftd><td>14%<\u002Ftd><td>순위 굳기, <b>CP4<\u002Fb><\u002Ftd><\u002Ftr>\n<tr><td><b>스퍼트<\u002Fb><\u002Ftd><td>140~150s<\u002Ftd><td>8%<\u002Ftd><td>SPD<\u002Ftd><td>0%<\u002Ftd><td>최후 추월 찬스<\u002Ftd><\u002Ftr>\n<\u002Ftable>\n\n<div class=\"grid g3\">\n  <div class=\"panel\"><h3>▶ Round 진행<\u002Fh3><p>각 라운드는 독립된 하나의 레이스입니다. 준비 단계에서 조건이 모두 공개되므로, 플레이어는 30초 안에 분석을 마치고 베팅해야 합니다.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ Turn 진행<\u002Fh3><p>턴은 동시 진행형입니다. 사전 베팅 30초 동안 모든 플레이어가 병렬로 베팅하고, 레이스 중 라이브 베팅도 체크포인트 오픈 시 동시에 열립니다.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 승리 조건<\u002Fh3><p>4라운드 정산 후 <b>최종 Chip이 가장 많은 플레이어가 승리<\u002Fb>합니다. 동점 시 성공한 Contract 등급 합계로 타이브레이크합니다.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note info\"><b>설계 의도.<\u002Fb> 각 라운드의 \"정보 공개 → 짧은 분석 → 베팅 → 실시간 관전 → 정산\"이 리듬을 이루어, 15분 내내 긴장과 환호가 끊기지 않도록 합니다.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 3 ----------\n`<section id=\"s4\"><div class=\"sec-head\"><div class=\"sec-num\">04<\u002Fdiv>\n<div><h2>게임 룰<\u002Fh2><div class=\"sub\">Game Rules<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">핵심 개념 6가지를 정확히 정의합니다. 모든 시스템은 이 용어 위에서 동작합니다.<\u002Fp>\n<div class=\"tbl-wrap\"><table>\n<thead><tr><th>개념<\u002Fth><th>정의<\u002Fth><th>세부 규칙<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><b>Round<\u002Fb><\u002Ftd><td>하나의 레이스 단위. 총 4라운드.<\u002Ftd><td>준비→사전베팅(30s)→레이스(150s)→정산. 라운드별 트랙·날씨·출전 캐릭터가 새로 배정됨.<\u002Ftd><\u002Ftr>\n<tr><td><b>Chip<\u002Fb><\u002Ftd><td>게임 내 재화이자 점수. 초기 700.<\u002Ftd><td>베팅 원금이자 승패 척도. 0이 되어도 탈락하지 않고 최소 베팅(라운드당 소액 지원 없음, 관전만) 상태로 잔류. 최종 Chip으로 순위 결정.<\u002Ftd><\u002Ftr>\n<tr><td><b>Bet(사전 베팅)<\u002Fb><\u002Ftd><td>레이스 시작 전 캐릭터에 거는 베팅.<\u002Ftd><td>단승(1위)/복승(3위 내)/순위지정 등. 배당은 사전 공개된 오즈로 확정. 분산 베팅 가능.<\u002Ftd><\u002Ftr>\n<tr><td><b>Live Bet(라이브 베팅)<\u002Fb><\u002Ftd><td>레이스 중 체크포인트에서 하는 베팅.<\u002Ftd><td><b>전 캐릭터에게 가능하되 배당은 순위에 따라 다름.<\u002Fb> 상위권은 배당이 낮고(안전·저수익), 하위권은 배당이 높다(위험·고수익). 후반 역전의 핵심.<\u002Ftd><\u002Ftr>\n<tr><td><b>Contract(미션)<\u002Fb><\u002Ftd><td>성공 시 보상, 실패 시 패널티가 있는 도전 카드.<\u002Ftd><td>라운드 시작 시 후보 중 선택. 난이도 Common~Legendary. 게임의 전략 축.<\u002Ftd><\u002Ftr>\n<tr><td><b>Result(정산)<\u002Fb><\u002Ftd><td>레이스 종료 후 순위 확정 및 지급.<\u002Ftd><td>배당 지급 → Contract 판정 → Chip 반영 순. 정산 로그가 Display에 공개됨.<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable><\u002Fdiv>\n<div class=\"grid g2\">\n<div class=\"note good\"><b>Chip 보존 규칙.<\u002Fb> 베팅하지 않은 Chip은 절대 사라지지 않습니다. 리스크를 지지 않으면 손해도 없지만, 이길 기회도 없습니다 — 이 긴장이 게임의 엔진입니다.<\u002Fdiv>\n<div class=\"note warn\"><b>라이브 배당 규칙.<\u002Fb> 라이브 베팅은 모든 캐릭터에게 열리지만 <b>배당이 순위에 반비례<\u002Fb>합니다. 이미 앞선 상위권은 배당이 아주 낮아(예: 1.1~1.3배) 태워도 수익이 미미하고, 뒤처진 하위권일수록 배당이 폭발합니다 — 안전 베팅은 가능하되 이득이 없어, 결국 판돈은 \"역전 시나리오\"로 흐릅니다.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 4 ----------\n`<section id=\"s5\"><div class=\"sec-head\"><div class=\"sec-num\">05<\u002Fdiv>\n<div><h2>베팅 시스템<\u002Fh2><div class=\"sub\">Betting System<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">베팅은 이 게임의 심장입니다. 사전 베팅으로 분석 실력을, 라이브 베팅으로 담력과 타이밍을 겨룹니다.<\u002Fp>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 경기 전 베팅 (Pre-Bet)<\u002Fh3>\n  <p>준비 단계에서 트랙·날씨·캐릭터·배당이 공개되면 30초간 베팅합니다.<\u002Fp>\n  <div class=\"chips\" style=\"margin-top:10px\">\n    <span class=\"chip info\">단승 1위 적중<\u002Fspan><span class=\"chip info\">복승 3위 내<\u002Fspan>\n    <span class=\"chip info\">순위 지정<\u002Fspan><span class=\"chip info\">대결(A vs B)<\u002Fspan><span class=\"chip gold\">분산 베팅<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin-top:12px\">배당(오즈)은 능력·조건 기반으로 사전 산출되어 고정됩니다. 인기가 몰려도 사전 배당은 바뀌지 않습니다(고정 오즈 방식).<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 라이브 베팅 (Live-Bet)<\u002Fh3>\n  <p>레이스 중 각 체크포인트에서 <b>모든 캐릭터<\u002Fb>의 베팅창이 열립니다. 단 배당이 순위에 연동되어, 상위권은 배당이 낮고 하위권일수록 배당이 높습니다. 후반부일수록 역전 시 배당이 폭발합니다.<\u002Fp>\n  <div class=\"chips\" style=\"margin-top:10px\">\n    <span class=\"chip info\">전 캐릭터 가능<\u002Fspan><span class=\"chip bad\">상위권 배당↓<\u002Fspan><span class=\"chip gold\">순위 낮을수록 배당↑<\u002Fspan><span class=\"chip gold\">후반 CP일수록 배율↑<\u002Fspan>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\"><h3>▶ 배당 계산 방식<\u002Fh3>\n<p>사전 배당은 승리 확률의 역수에 하우스 마진과 조건 보정을 반영해 산출합니다.<\u002Fp>\n<div class=\"formula\">\n<span class=\"var\">기대승률 P<\u002Fspan> <span class=\"op\">=<\u002Fspan> f( 능력치 <span class=\"op\">·<\u002Fspan> 트랙적합 <span class=\"op\">·<\u002Fspan> 날씨적합 <span class=\"op\">·<\u002Fspan> 거리 <span class=\"op\">·<\u002Fspan> 이벤트기대값 )<br/>\n<span class=\"var\">사전배당(Odds)<\u002Fspan> <span class=\"op\">=<\u002Fspan> ( 1 <span class=\"op\">/<\u002Fspan> P ) <span class=\"op\">×<\u002Fspan> 0.88 <span style=\"color:var(--muted);font-size:9px\">( 마진 12% )<\u002Fspan><br/>\n<span class=\"var\">라이브배당<\u002Fspan> <span class=\"op\">=<\u002Fspan> 기본배당 <span class=\"op\">×<\u002Fspan> 순위계수 <span class=\"op\">×<\u002Fspan> ( 1 <span class=\"op\">+<\u002Fspan> 잔여거리비율 )\n<\u002Fdiv>\n<h4>Chip 계산 (지급)<\u002Fh4>\n<div class=\"formula\">\n<span class=\"var\">단승 수익<\u002Fspan> <span class=\"op\">=<\u002Fspan> 베팅액 <span class=\"op\">×<\u002Fspan> Odds <span style=\"color:var(--muted);font-size:9px\">( 적중 시 )<\u002Fspan><br/>\n<span class=\"var\">순손익<\u002Fspan> <span class=\"op\">=<\u002Fspan> Σ(적중 수익) <span class=\"op\">−<\u002Fspan> Σ(전체 베팅액) <span class=\"op\">+<\u002Fspan> Contract 정산\n<\u002Fdiv><\u002Fdiv>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">RISK<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">고배당일수록 적중률은 낮다. 올인은 파산 위험. 분산은 안전하지만 수익도 작다.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">STRATEGY<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">저평가된 캐릭터(조건 시너지 보유) 발굴이 최대 이득. 배당은 조건을 완전히 반영하지 않는다.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">TIMING<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">라이브 베팅은 빨리 걸수록 배당이 높지만 불확실. 늦게 걸면 안전하나 배율↓.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\"><b>예시.<\u002Fb> 화산 트랙 + 폭염 날씨. 엠버는 열내성 패시브로 실제 승률 32%인데 사전 배당이 3.0배(=암시 확률 29%)로 잡혔다. → <b>기대값 = 0.32 × 3.0 = 0.96<\u002Fb>보다 실질 우위. 여기에 라운드 중 '용암 분출' 이벤트가 뜨면 엠버만 무피해 → 라이브 베팅 없이도 사전에 100 Chip을 엠버 단승에 걸어 <b>+300 Chip<\u002Fb> 기대. 반대로 프로스티는 화산에서 STA 2배 소모 → 하위권 → 후반 라이브 배당 8배 함정(회복 불가). 이런 조건을 읽어내는 것이 실력입니다.<\u002Fdiv>\n<div class=\"note info\"><b>🎮 인터랙티브 도구.<\u002Fb> 이 배당·기대값 모델을 직접 돌려볼 수 있는 <a href=\"Betting Simulator.html\"><b>배당·기대값 시뮬레이터 ▸<\u002Fb><\u002Fa> 를 함께 제공합니다. 트랙·날씨·마진·변동성을 슬라이더로 바꾸며 <b>시장 배당 vs 실제 승률(몬테카를로)<\u002Fb>의 간격 — 즉 +EV 밸류 베팅이 어디서 생기는지를 눈으로 확인하세요.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 5 (dynamic) ----------\n`<section id=\"s6\"><div class=\"sec-head\"><div class=\"sec-num\">06<\u002Fdiv>\n<div><h2>Contract (미션) 시스템<\u002Fh2><div class=\"sub\">Contract System<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">Contract는 레디셋벳의 미션 카드처럼 게임의 <b>핵심 전략 요소<\u002Fb>입니다. 단순 베팅을 넘어 \"특정 시나리오를 실현하라\"는 도전으로, 성공 시 큰 보상·실패 시 패널티가 따릅니다.<\u002Fp>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 개념 · 선택 방식<\u002Fh3>\n  <p>라운드 시작 시 무작위 후보 3장이 제시되고 그중 <b>1장을 선택(또는 스킵)<\u002Fb>합니다. 등급이 높을수록 조건이 까다롭지만 보상이 큽니다. 선택한 Contract는 그 라운드 정산 시 자동 판정됩니다.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 성공/실패 · 보상/패널티<\u002Fh3>\n  <p>성공 시 카드에 명시된 Chip 보상을 즉시 획득합니다. 실패 시 패널티 Chip이 차감됩니다(일부 Legendary는 재산 비율 차감). 스킵하면 보상·패널티 모두 없습니다 — 안전과 욕심의 균형.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\" style=\"border-left:6px solid var(--gold)\"><h3>▶ 베팅 연동 설계 (Contract × Bet 결합)<\u002Fh3>\n<p>Contract가 베팅과 따로 놀지 않도록, <b>미션을 활성화하려면 그 방향으로 실제 베팅을 해야 하는<\u002Fb> 구조로 묶습니다. Contract는 단순 판정기가 아니라 \"베팅 배율기\"로 작동해야 시너지가 생깁니다.<\u002Fp>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">① 스테이크 결합<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">Contract는 지정 캐릭터에 <b>최소 베팅액(예: 50 Chip) 이상을 걸어야 판정 대상<\u002Fb>이 된다. 미션만 받고 따로 놀 수 없음.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">② 배율 증폭<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">Contract 대상에 건 베팅이 적중하면 <b>배당 + Contract 보상이 동시 지급<\u002Fb> → 같은 선택이 두 번 보상받는 복리 구조.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">③ 방향 일치<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">\"안전 베팅 vs 도전 미션\"의 모순 제거 — Contract 난이도가 곧 베팅 공격성을 결정. Legendary를 고르면 자연스럽게 공격적 베팅을 하게 됨.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note good\" style=\"margin:14px 0 0\"><b>예시.<\u002Fb> '언더독 역전(RARE)' Contract를 선택 → 하위권 머드에 50 Chip 라이브 베팅을 거는 순간 미션이 자동 활성화. 머드가 3위 안으로 들어오면 <b>라이브 배당(고배율) + Contract 보상<\u002Fb>을 한 번에 획득. 베팅과 미션이 <b>같은 의사결정<\u002Fb>으로 통합됩니다.<\u002Fdiv><\u002Fdiv>\n<div class=\"note info\"><b>난이도 분류.<\u002Fb> <span class=\"rar common\">COMMON<\u002Fspan> 무난·저위험 · <span class=\"rar rare\">RARE<\u002Fspan> 조건부 고수익 · <span class=\"rar epic\">EPIC<\u002Fspan> 고난도 역전형 · <span class=\"rar legendary\">LEGENDARY<\u002Fspan> 게임 승패를 가르는 한 방. 아래는 32종 예시 카드입니다.<\u002Fp>\n<div class=\"filterbar\" id=\"cFilter\">\n  <span class=\"fbtn on\" data-r=\"all\">전체 (${CONTRACTS.length})<\u002Fspan>\n  <span class=\"fbtn\" data-r=\"common\">COMMON<\u002Fspan>\n  <span class=\"fbtn\" data-r=\"rare\">RARE<\u002Fspan>\n  <span class=\"fbtn\" data-r=\"epic\">EPIC<\u002Fspan>\n  <span class=\"fbtn\" data-r=\"legendary\">LEGENDARY<\u002Fspan>\n<\u002Fdiv>\n<div class=\"grid g3\" id=\"cGrid\"><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 6 ----------\n`<section id=\"s7\"><div class=\"sec-head\"><div class=\"sec-num\">07<\u002Fdiv>\n<div><h2>레이스 시스템<\u002Fh2><div class=\"sub\">Race System<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">레이스는 약 <b>2분 30초<\u002Fb> 동안 진행되며, 능력·트랙·날씨·거리·이벤트가 매 순간 상호작용합니다. 무작위가 아니라 <b>예측 가능한 변수<\u002Fb>의 연쇄입니다.<\u002Fp>\n<div class=\"panel\"><h3>▶ 레이스 타임라인 (체크포인트)<\u002Fh3>\n<div class=\"flow\"><div class=\"flow-row\">\n  <div class=\"flow-node start\"><span class=\"t\">START<\u002Fspan><span class=\"d\">0:00 스타트 대시<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">CP 1<\u002Fspan><span class=\"d\">0:35 라이브 오픈<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">CP 2<\u002Fspan><span class=\"d\">1:10 이벤트 집중<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">CP 3<\u002Fspan><span class=\"d\">1:50 역전 구간<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node end\"><span class=\"t\">FINISH<\u002Fspan><span class=\"d\">2:30 스퍼트·골<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<p class=\"muted\" style=\"margin-top:14px\">각 체크포인트에서 순위가 갱신되고 전 캐릭터 대상 라이브 베팅창이 열립니다. 배당은 순위에 반비례하며(상위권↓·하위권↑), 체크포인트가 뒤로 갈수록 라이브 배당 배율이 커집니다.<\u002Fp><\u002Fdiv>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 이벤트 · 역전<\u002Fh3><p>레이스 중 부스터·함정·환경·캐릭터 이벤트가 발생해 순위를 흔듭니다. '언더독' 패시브(머드)나 후반 스퍼트(록시)를 가진 캐릭터는 이 구간에서 진가를 발휘합니다. 역전은 곧 라이브 베팅의 존재 이유입니다.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 부스터 · 후반 스퍼트<\u002Fh3><p>부스트 패드·니트로·상승기류로 순간 가속이 발생합니다. 마지막 체크포인트 이후 <b>스퍼트 구간<\u002Fb>에서는 스태미나가 남은 캐릭터가 폭발적으로 가속 — 초반 리드형(볼트)과 후반 지구력형(세이지·록시)의 대비가 극대화됩니다.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\"><h3>▶ AI 행동 규칙<\u002Fh3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>국면<\u002Fth><th>AI 행동<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>초반 (0~35s)<\u002Ftd><td>스타트 능력·가속 스탯대로 포지셔닝. 초반형 캐릭터가 선두 확보.<\u002Ftd><\u002Ftr>\n<tr><td>중반 (35~110s)<\u002Ftd><td>스태미나 관리·라인 선택. TEC 높은 AI는 코너 손실 최소화, 이벤트 회피 판단.<\u002Ftd><\u002Ftr>\n<tr><td>후반 (110~150s)<\u002Ftd><td>언더독/스퍼트 보정 발동. 하위권은 공격적 추월, 상위권은 방어 주행.<\u002Ftd><\u002Ftr>\n<tr><td>액티브 사용<\u002Ftd><td>기대 이득이 최대인 타이밍에 자동 발동(예: 워프는 근접 추월 직전, 오버클럭은 직선에서).<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p class=\"muted\">모든 판정은 시드 기반 결정론 + 소량의 확률 노이즈로 계산됩니다. 동일 조건·시드면 재현 가능해, 리플레이·검증·중계 해설이 가능합니다.<\u002Fp><\u002Fdiv>\n<div class=\"panel\" style=\"border-left:6px solid var(--info)\"><h3>▶ 관전 몰입 설계 (Anti-Boredom)<\u002Fh3>\n<p>\"내 캐릭터가 초반에 정해지면 2분 30초간 볼 게 없다\"는 리스크를 막기 위해, 레이스를 <b>35초 간격의 의사결정 펌프<\u002Fb>로 설계합니다. 관전이 아니라 개입이 계속됩니다.<\u002Fp>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">라이브 빈도<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">체크포인트 3회 × 매 CP마다 베팅창 오픈. 평균 <b>40여 초마다<\u002Fb> \"다음 한 수\"를 고민하게 만듦.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">이벤트 페이싱<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">중반(CP2) 이벤트 집중 배치 → 순위 뒤집힘이 라이브 베팅 직전에 터져 <b>배당이 출렘이는<\u002Fb> 긴장감 연출.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">모멘트 카메라<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">추월·역전·접전 골인을 카메라가 자동 포착 + 슬로우 줄인. 내 베팅과 무관하게도 <b>브 거리<\u002Fb>가 계속 나옴.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin:12px 0 0\"><b>설계 지표:<\u002Fb> 평균 레이스당 순위 변동 3회 이상, 라이브 베팅 참여율 60% 이상 — 미달 시 체크포인트·이벤트 밀도를 상향 튜닝.<\u002Fp><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 7 (dynamic) ----------\n`<section id=\"s8\"><div class=\"sec-head\"><div class=\"sec-num\">08<\u002Fdiv>\n<div><h2>캐릭터<\u002Fh2><div class=\"sub\">Characters · 12 Racers<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">12명의 레이서. 각자 고유 능력치(SPD·ACC·STA·LCK·TEC), 패시브, 액티브, 선호 트랙·날씨, 약점을 지닙니다. 이 프로필을 읽는 것이 곧 베팅 실력입니다.<\u002Fp>\n<div class=\"grid g4 charcards\" id=\"charGrid\"><\u002Fdiv>\n<h4 style=\"font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:24px 0 12px\">◆ 캐릭터 능력 요약표<\u002Fh4>\n<div class=\"tbl-wrap\"><table id=\"charTable\"><thead><tr>\n<th>캐릭터<\u002Fth><th>역할<\u002Fth><th>SPD<\u002Fth><th>ACC<\u002Fth><th>STA<\u002Fth><th>LCK<\u002Fth><th>TEC<\u002Fth><th>선호 트랙<\u002Fth><th>선호 날씨<\u002Fth><th>약점<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 8 (dynamic) ----------\n`<section id=\"s9\"><div class=\"sec-head\"><div class=\"sec-num\">09<\u002Fdiv>\n<div><h2>트랙<\u002Fh2><div class=\"sub\">Tracks · 10 Courses<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">10종의 트랙. 거리·지형·유리 캐릭터가 모두 다릅니다. 트랙은 배당의 절반을 결정하는 변수입니다.<\u002Fp>\n<div class=\"grid g2\" id=\"trackGrid\"><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 9 (dynamic) ----------\n`<section id=\"s10\"><div class=\"sec-head\"><div class=\"sec-num\">10<\u002Fdiv>\n<div><h2>날씨<\u002Fh2><div class=\"sub\">Weather · 10 Types<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">10종의 날씨가 능력치와 이벤트 확률을 바꿉니다. 날씨×트랙×캐릭터의 삼중 시너지가 예측의 핵심입니다.<\u002Fp>\n<div class=\"tbl-wrap\"><table id=\"weatherTable\"><thead><tr><th>날씨<\u002Fth><th>빈도<\u002Fth><th>효과<\u002Fth><\u002Ftr><\u002Fthead><tbody><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 10 (dynamic) ----------\n`<section id=\"s11\"><div class=\"sec-head\"><div class=\"sec-num\">11<\u002Fdiv>\n<div><h2>이벤트<\u002Fh2><div class=\"sub\">Events · ${EVENTS.length} Types<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">레이스 중 발생하는 ${EVENTS.length}종의 이벤트. 좋은/나쁜/랜덤/환경/캐릭터 이벤트가 순위를 흔들되, 대부분 트랙·날씨·능력에 <b>조건부<\u002Fb>로 발동해 예측 가능합니다.<\u002Fp>\n<div class=\"filterbar\" id=\"eFilter\">\n  <span class=\"fbtn on\" data-c=\"all\">전체 (${EVENTS.length})<\u002Fspan>\n  <span class=\"fbtn\" data-c=\"good\">좋은<\u002Fspan>\n  <span class=\"fbtn\" data-c=\"bad\">나쁜<\u002Fspan>\n  <span class=\"fbtn\" data-c=\"random\">랜덤<\u002Fspan>\n  <span class=\"fbtn\" data-c=\"env\">환경<\u002Fspan>\n  <span class=\"fbtn\" data-c=\"char\">캐릭터<\u002Fspan>\n<\u002Fdiv>\n<div class=\"tbl-wrap\"><table id=\"eventTable\"><thead><tr><th>분류<\u002Fth><th>이벤트<\u002Fth><th>효과<\u002Fth><th>발동 조건<\u002Fth><\u002Ftr><\u002Fthead><tbody><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 11 ----------\n`<section id=\"s12\"><div class=\"sec-head\"><div class=\"sec-num\">12<\u002Fdiv>\n<div><h2>Display 화면<\u002Fh2><div class=\"sub\">Display Mode UI<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">Display는 <b>모두가 함께 보는 중계 화면<\u002Fb>입니다. 별도 클라이언트가 아니라, 참가자 중 한 명의 Player View가 Display Mode로 전환되어 큰 화면(TV·모니터)에 미러링됩니다.<\u002Fp>\n<div class=\"wire\"><div class=\"wire-label\">▶ DISPLAY LAYOUT — 16:9 관전 화면 (배지·자막해설·응원 반영)<\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox accent\"><b>ROUND 2 / 4<\u002Fb>🌋 화산 · ☀️ 맑음<\u002Fdiv><div class=\"wbox\"><b>TIMER<\u002Fb>1:42 / 2:30<\u002Fdiv><div class=\"wbox p\"><b>LIVE BET · CP2<\u002Fb>하위권 고배당 오픈<\u002Fdiv><\u002Fdiv>\n  <div class=\"wrow\" style=\"min-height:230px\">\n    <div class=\"wbox\" style=\"flex:3;min-height:230px\"><b>RACE TRACK VIEW<\u002Fb>픽셀 사이드뷰 · 스프라이트 주행 · 체크포인트 깃발 · 이벤트 팝업 · 역전 순간 줌인 카메라<\u002Fdiv>\n    <div class=\"wbox\" style=\"flex:1;min-height:230px;justify-content:flex-start\"><b>RANKING + 배지<\u002Fb><div style=\"text-align:left;font-size:15px;margin-top:6px\">1 🔥 엠버 <span style=\"color:var(--good)\">🔥강함<\u002Fspan><br/>2 🪨 록시<br/>3 🤖 네오<br/>4 🌿 세이지 <span style=\"color:var(--gold)\">↗스퍼트<\u002Fspan><br/>5 🐸 머드<br/>… 8 ❄️ 프로스티 <span style=\"color:var(--bad)\">💀약함<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox p\"><b>EVENT FEED (자막 해설)<\u002Fb>🌋 용암 분출! \"프로스티가 밀립니다\"<\u002Fdiv><div class=\"wbox\"><b>ODDS TICKER<\u002Fb>머드 4.2▲ · 프로스티 8.0▲<\u002Fdiv><div class=\"wbox accent\"><b>REACTIONS 👏🔥😮<\u002Fb>P3 \"가자!\" · 관중 응원<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note info small\"><b>접근성 반영.<\u002Fb> Display는 룰을 몰라도 즐기게 만드는 창입니다 — 순위 옆 <b>강함/약함/스퍼트 배지<\u002Fb>로 상황을, <b>자막 해설<\u002Fb>로 \"지금 무슨 일이 벌어졌는지\"를, <b>리액션 버튼<\u002Fb>으로 비(非)베팅자도 파티에 끼게 합니다.<\u002Fdiv>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">역할<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">경기 상황·순위·이벤트·배당·플레이어 Chip을 한눈에. 관전의 즐거움을 담당.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">우선순위<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">① 레이스 뷰 ② 실시간 순위 ③ 이벤트 피드 ④ 배당·플레이어 현황.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">전환<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">Display 담당 플레이어도 베팅 가능(개인 UI는 Display 위 오버레이로 최소화).<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 12 ----------\n`<section id=\"s13\"><div class=\"sec-head\"><div class=\"sec-num\">13<\u002Fdiv>\n<div><h2>Player 화면<\u002Fh2><div class=\"sub\">Player Mode UI<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">각 플레이어의 개인 조작 화면(모바일 세로 기준). 베팅·Contract·라이브 베팅을 여기서 실행합니다. Display는 관전, Player는 조작을 담당합니다.<\u002Fp>\n<div class=\"wire\" style=\"max-width:420px\"><div class=\"wire-label\">▶ PLAYER LAYOUT — 모바일 세로 (접근성 반영)<\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox accent\"><b>MY CHIP<\u002Fb>💰 920<\u002Fdiv><div class=\"wbox\"><b>R2 / 4<\u002Fb>🌋 화산 · ☀️<\u002Fdiv><\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox accent\" style=\"min-height:104px;justify-content:flex-start\"><b>⭐ 추천 3픽 · 원탭 베팅<\u002Fb><div style=\"text-align:left;font-size:15px;margin-top:6px\">🔥 엠버 1.9x <span style=\"color:var(--muted)\">\"화산을 지배해요\"<\u002Fspan><br/>🪨 록시 2.4x <span style=\"color:var(--muted)\">\"막판 스퍼트\"<\u002Fspan><br/>🌿 세이지 3.1x <span style=\"color:var(--muted)\">\"긴 코스 강함\"<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox p\" style=\"min-height:118px;justify-content:flex-start\"><b>MINI RANKING + 배지<\u002Fb><div style=\"text-align:left;font-size:15px;margin-top:6px\">1 🔥 엠버 <span style=\"color:var(--good)\">🔥<\u002Fspan> · 2 🪨 록시<br/>3 🤖 네오 · 4 🌿 세이지 <span style=\"color:var(--gold)\">↗<\u002Fspan><br/>7 ⚡ 볼트 · 8 ❄️ 프로스티 <span style=\"color:var(--bad)\">💀<\u002Fspan> <span style=\"color:var(--gold)\">(고배당)<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox accent\" style=\"min-height:60px\"><b>LIVE BET · CP2 OPEN<\u002Fb>엠버 1.2x · 프로스티 8.0x ▸ TAP<\u002Fdiv><\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox\" style=\"min-height:54px\"><b>MY BETS<\u002Fb>엠버 단승 100<\u002Fdiv><div class=\"wbox p\" style=\"min-height:54px\"><b>CONTRACT<\u002Fb>⭐ 언더독 역전<\u002Fdiv><\u002Fdiv>\n  <div class=\"wrow\"><div class=\"wbox\" style=\"flex:1\"><b>BET<\u002Fb><\u002Fdiv><div class=\"wbox\" style=\"flex:1\"><b>CONTRACT<\u002Fb><\u002Fdiv><div class=\"wbox accent\" style=\"flex:1\"><b>RANK<\u002Fb><\u002Fdiv><div class=\"wbox\" style=\"flex:1\"><b>자세히<\u002Fb><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"chips\" style=\"margin:0 0 16px\"><span class=\"chip good\">첫 판 간이 모드: 단승만<\u002Fspan><span class=\"chip gold\">⭐ 원탭 추천 베팅<\u002Fspan><span class=\"chip info\">배지로 0초 판독<\u002Fspan><span class=\"chip\">‘자세히’로 수치 펼침<\u002Fspan><\u002Fdiv>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 구성 요소<\u002Fh3>\n  <div class=\"chips\"><span class=\"chip gold\">Chip 잔액<\u002Fspan><span class=\"chip info\">Bet 목록<\u002Fspan><span class=\"chip info\">Contract 진행 상태<\u002Fspan><span class=\"chip\">Live Bet 패널<\u002Fspan><span class=\"chip\">실시간 Ranking<\u002Fspan><\u002Fdiv>\n  <p style=\"margin-top:12px\">하단 탭으로 Bet / Contract / Ranking을 전환합니다. 라이브 베팅창이 열리면 상단에 강조 배너 + 진동/사운드 알림.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 인터랙션 원칙<\u002Fh3>\n  <p>베팅은 3탭 이내(캐릭터 선택 → 금액 슬라이더 → 확정)로 끝나야 합니다. 라이브 베팅은 시간 압박이 있으므로 원탭 프리셋(25/50/100)을 제공합니다. 히트 타깃 최소 44px.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\" style=\"border-left:6px solid var(--gold)\"><h3>▶ 온보딩 · 추천 UI (정보 과부하 완화)<\u002Fh3>\n<p>캐릭터 12·트랙·날씨·이벤트·배당·Contract를 30초 안에 다 읽는 건 신규 유저에게 가혹합니다. <b>\"뭐를 볼지\"를 시스템이 앉게 도와줍니다.<\u002Fb><\u002Fp>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">시너지 배지<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">각 캐릭터 옆에 <span class=\"chip good\" style=\"font-size:8px\">↑트랙적합<\u002Fspan> <span class=\"chip info\" style=\"font-size:8px\">↑날씨적합<\u002Fspan> 같은 아이콘을 단순 표시 — 수치 안 읽어도 유리/불리가 한눈에.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">추천 픽<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">조건 분석 기반 <b>\"기대값 TOP 3\" 추천 카드<\u002Fb> 제시(근거 한 줄 포함). 초보는 따라가고, 고수는 역배팅.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">초보 모드<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">첫 1~2라운드는 단승/복승만 노출·Contract 간단 카드만 제시. 라운드가 갈수록 라이브·고난도 옵션을 <b>점진 공개<\u002Fb>.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin:12px 0 0\">침착 정도는 옵션화 — 고수는 추천·배지를 끔고 순수 분석으로, 초보는 켜고 안정적으로. 정보량은 유저가 조절합니다.<\u002Fp><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 13 ----------\n`<section id=\"s14\"><div class=\"sec-head\"><div class=\"sec-num\">14<\u002Fdiv>\n<div><h2>UI Design Guide<\u002Fh2><div class=\"sub\">UI Design Guide<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">고전 픽셀 RPG 감성(SNES·GBA·Stardew·Pokémon GBA·FF6)을 다크 네이비·퍼플·골드로 재해석합니다. 모든 요소는 픽셀 경계·노치 코너·계단식 그림자를 따릅니다.<\u002Fp>\n<div class=\"panel\"><h3>▶ 컬러 팔레트<\u002Fh3>\n<div class=\"grid g4\">\n  ${['#0b0a17|BG','#181433|PANEL','#15223f|NAVY','#7a5cf0|PURPLE','#f5c542|GOLD','#4fd88a|GOOD','#ff5d6c|BAD','#57c7ff|INFO'].map(x=>{const[c,n]=x.split('|');return `<div class=\"mini\" style=\"text-align:center\"><div style=\"height:44px;background:${c};border:2px solid #000;margin-bottom:8px\"><\u002Fdiv><span class=\"k\" style=\"margin:0\">${n}<\u002Fspan><div class=\"muted\" style=\"font-size:14px\">${c}<\u002Fdiv><\u002Fdiv>`}).join('')}\n<\u002Fdiv><\u002Fdiv>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 폰트<\u002Fh3>\n  <p><span class=\"pix\" style=\"font-size:12px;color:var(--gold)\">Press Start 2P<\u002Fspan> — 제목·라벨·수치(픽셀 헤드라인).<\u002Fp>\n  <p style=\"font-size:22px\">VT323 / Galmuri11 — 본문·설명(가독성 높은 레트로 비트맵).<\u002Fp>\n  <p class=\"muted\">규칙: 헤드라인은 픽셀 폰트, 본문은 비트맵 폰트로 계층 분리. 안티에일리어싱 off로 도트 느낌 유지.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ Spacing · Pixel Style<\u002Fh3>\n  <p>4px 그리드 기반. 여백은 8·12·16·20·24px 단위. 모든 박스는 <b>노치 코너(8px)<\u002Fb> + <b>계단식 그림자(6px 6px)<\u002Fb> + 2px 내부 하이라이트로 RPG 메뉴 창을 재현. border-radius 사용 금지.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid g3\">\n  <div class=\"panel\"><h3>▶ 버튼<\u002Fh3><span class=\"fbtn on\" style=\"display:inline-block\">PRIMARY<\u002Fspan> <span class=\"fbtn\" style=\"display:inline-block;margin-top:8px\">SECONDARY<\u002Fspan><p class=\"muted\" style=\"margin-top:10px;font-size:16px\">눌림 시 2px 아래로 내려가며 그림자 축소(물리적 눌림감).<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 카드<\u002Fh3><div class=\"mini\" style=\"text-align:center\"><span class=\"v\" style=\"font-size:14px\">CARD<\u002Fspan><\u002Fdiv><p class=\"muted\" style=\"margin-top:10px;font-size:16px\">노치 코너·계단 그림자. 등급별 테두리 색으로 정보 위계 표현.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ HUD · Icon<\u002Fh3><div class=\"chips\"><span class=\"chip gold\">💰 Chip<\u002Fspan><span class=\"chip info\">🏁 Rank<\u002Fspan><span class=\"chip\">⭐ Contract<\u002Fspan><\u002Fdiv><p class=\"muted\" style=\"margin-top:10px;font-size:16px\">아이콘은 16×16 픽셀 스프라이트. HUD는 화면 가장자리 고정.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\"><h3>▶ 모달<\u002Fh3><p>화면 중앙, 반투명 어두운 딤 배경 + 노치 코너 창. 상단에 픽셀 타이틀 바, 우상단 [X], 하단 확정/취소 버튼. 등장은 스케일 스텝(80%→100%) 애니메이션.<\u002Fp><\u002Fdiv>\n<div class=\"note\"><b>Animation(요약).<\u002Fb> 모든 전환은 <code>steps()<\u002Fcode> 기반 프레임 애니메이션으로 부드러움을 배제하고 도트 게임 특유의 딱딱한 끊김을 유지합니다. 상세는 14장 참고.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 14 ----------\n`<section id=\"s15\"><div class=\"sec-head\"><div class=\"sec-num\">15<\u002Fdiv>\n<div><h2>Animation Guide<\u002Fh2><div class=\"sub\">Animation Guide<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">레트로 감성을 지키되 타격감과 쾌감은 현대적으로. 모든 모션은 프레임 단위(<code>steps()<\u002Fcode>)로 처리해 도트 게임의 질감을 유지합니다.<\u002Fp>\n<div class=\"tbl-wrap\"><table><thead><tr><th>상황<\u002Fth><th>연출<\u002Fth><th>세부<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td><b>카메라<\u002Fb><\u002Ftd><td>선두 추적 + 역전 시 줌인<\u002Ftd><td>순위 변동 시 해당 캐릭터로 0.3s 팬. 접전 골인 시 슬로우 줌.<\u002Ftd><\u002Ftr>\n<tr><td><b>Particle<\u002Fb><\u002Ftd><td>스피드 라인·먼지·불꽃<\u002Ftd><td>캐릭터 속성별 파티클(불/서리/모래/별). 부스트 시 밀도 증가.<\u002Ftd><\u002Ftr>\n<tr><td><b>Screen Shake<\u002Fb><\u002Ftd><td>충돌·용암·낙뢰<\u002Ftd><td>2~4px 진폭, 6프레임. 큰 이벤트일수록 강도↑(과용 금지).<\u002Ftd><\u002Ftr>\n<tr><td><b>Hit<\u002Fb><\u002Ftd><td>충돌 히트스톱<\u002Ftd><td>충돌 순간 2프레임 정지 + 흰색 플래시 → 타격감.<\u002Ftd><\u002Ftr>\n<tr><td><b>Boost<\u002Fb><\u002Ftd><td>가속 트레일·FOV 왜곡<\u002Ftd><td>부스트 시 잔상 3장 + 스피드라인 + 살짝 넓어지는 시야.<\u002Ftd><\u002Ftr>\n<tr><td><b>Finish<\u002Fb><\u002Ftd><td>골인 테이프·플래시<\u002Ftd><td>결승선 통과 시 화면 플래시 + 폭죽 파티클 + 리본 컷.<\u002Ftd><\u002Ftr>\n<tr><td><b>Goal(순위확정)<\u002Fb><\u002Ftd><td>순위 보드 슬라이드 인<\u002Ftd><td>1→8위 순차 카운트업, 골드 하이라이트.<\u002Ftd><\u002Ftr>\n<tr><td><b>Chip 획득<\u002Fb><\u002Ftd><td>코인 튀어오름 + 카운트업<\u002Ftd><td>💰 스프라이트가 HUD로 날아가 잔액 롤업. \"칭!\" SE 동기화.<\u002Ftd><\u002Ftr>\n<tr><td><b>Mission 성공<\u002Fb><\u002Ftd><td>골드 버스트 + 카드 플립<\u002Ftd><td>Contract 카드 뒤집히며 SUCCESS 스탬프 + 광선 파티클.<\u002Ftd><\u002Ftr>\n<tr><td><b>Mission 실패<\u002Fb><\u002Ftd><td>카드 크랙 + 붉은 셰이크<\u002Ftd><td>카드에 균열, 화면 붉은 비네트 + 짧은 셰이크.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<div class=\"note info\"><b>원칙.<\u002Fb> 60fps 유지, 동시 파티클 상한 관리(모바일 성능). 중요 정보(순위·베팅 결과) 애니메이션은 스킵/즉시 표시 옵션 제공(가독성 우선).<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 15 ----------\n`<section id=\"s16\"><div class=\"sec-head\"><div class=\"sec-num\">16<\u002Fdiv>\n<div><h2>Sound Guide<\u002Fh2><div class=\"sub\">Sound Guide<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">칩튠(chiptune) 기반의 사운드로 고전 게임 감성을 완성합니다. 상황별 음악과 효과음이 긴장과 환호의 리듬을 만듭니다.<\u002Fp>\n<div class=\"grid g3\">\n  <div class=\"panel\"><h3>▶ BGM<\u002Fh3>\n  <p>칩튠/8bit 오케스트라 스타일.<\u002Fp>\n  <div class=\"chips\"><span class=\"chip\">로비: 밝은 루프<\u002Fspan><span class=\"chip\">베팅: 긴장 틱톡<\u002Fspan><span class=\"chip\">레이스: 업템포<\u002Fspan><span class=\"chip gold\">막판: 템포 상승<\u002Fspan><span class=\"chip\">정산: 팡파레<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ SE (효과음)<\u002Fh3>\n  <div class=\"chips\"><span class=\"chip info\">칩 획득 \"칭!\"<\u002Fspan><span class=\"chip info\">베팅 확정<\u002Fspan><span class=\"chip info\">부스트 \"슝\"<\u002Fspan><span class=\"chip bad\">충돌 \"쾅\"<\u002Fspan><span class=\"chip good\">미션 성공<\u002Fspan><span class=\"chip bad\">미션 실패<\u002Fspan><span class=\"chip gold\">골인 팡파레<\u002Fspan><span class=\"chip\">카운트다운 틱<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ Voice<\u002Fh3>\n  <p>짧은 픽셀 보이스/의성어(가챠·보코더 느낌).<\u002Fp>\n  <div class=\"chips\"><span class=\"chip\">\"GO!\" 스타트<\u002Fspan><span class=\"chip\">\"OVERTAKE!\"<\u002Fspan><span class=\"chip\">\"FINISH!\"<\u002Fspan><span class=\"chip gold\">해설 한마디(확장)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\"><b>추천 방향.<\u002Fb> Howler.js로 채널 분리(BGM/SE/Voice), 막판 스퍼트 구간에서 BGM 템포·피치를 동적으로 올려 긴장 고조. 라이브 베팅창 오픈 시 전용 알림음으로 즉각 반응 유도. 모든 사운드는 짧고 명료하게(레트로 특유의 절제).<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 16 ----------\n`<section id=\"s17\"><div class=\"sec-head\"><div class=\"sec-num\">17<\u002Fdiv>\n<div><h2>Game Balance<\u002Fh2><div class=\"sub\">Balance Design Rationale<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">이 게임의 설계 철학은 하나입니다 — <b>운 게임이 아니라, 정보를 분석해 기대값이 가장 높은 선택을 하는 전략 게임<\u002Fb>. 모든 수치는 이 철학을 위해 조율됩니다.<\u002Fp>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 왜 이런 밸런스인가<\u002Fh3>\n  <ul style=\"margin:0;padding-left:18px\">\n  <li>캐릭터 능력치를 5축(SPD·ACC·STA·LCK·TEC)으로 나눠 <b>절대 강캐가 없게<\u002Fb> 설계. 모든 캐릭터가 특정 트랙×날씨에서만 최강.<\u002Fli>\n  <li>배당은 승률의 88%만 반영(마진 12%) → 무지성 인기 베팅은 장기적으로 손해. <b>저평가 발굴<\u002Fb>이 유일한 초과수익원.<\u002Fli>\n  <li>라이브 배당을 순위에 반비례시켜, 선두 추종 안전 베팅은 수익이 거의 없게(저배당) 만들어 판돈이 역전 쪽으로 흐르게 유도.<\u002Fli>\n  <\u002Ful><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 왜 전략성이 생기는가<\u002Fh3>\n  <ul style=\"margin:0;padding-left:18px\">\n  <li>결과가 <b>능력·트랙·날씨·거리·이벤트<\u002Fb>의 결정론적 조합 → 분석하면 확률이 보인다.<\u002Fli>\n  <li>Contract가 \"순위 예측\"을 넘어 \"시나리오 실현\"을 요구 → 베팅과 미션을 동시에 최적화하는 다층 의사결정.<\u002Fli>\n  <li>Chip 총량 관리(파산 회피 vs 역전 필요)라는 자원 곡선이 매 라운드 압박을 만든다.<\u002Fli>\n  <\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\"><h3>▶ 왜 계속 플레이하게 되는가<\u002Fh3>\n<div class=\"grid g3\">\n  <div class=\"mini\"><span class=\"k\">서사<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">하위권 라이브 베팅 → 후반 역전이라는 <b>드라마<\u002Fb>가 매 레이스 생성. 관전 자체가 재미.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">숙련<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">할수록 조건-결과 상관을 학습 → 실력 성장이 체감되는 <b>숙련 곡선<\u002Fb>.<\u002Fp><\u002Fdiv>\n  <div class=\"mini\"><span class=\"k\">분산<\u002Fspan><p class=\"muted\" style=\"margin:8px 0 0;font-size:16px\">Legendary Contract·라이브 폭발 배당으로 <b>한 방 역전<\u002Fb> 여지 → 끝까지 포기 없음.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"note good\"><b>밸런스 검증 지표.<\u002Fb> ① 캐릭터별 우승률 편차 ±5% 이내(조건 무작위 시). ② 1위 플레이어가 최종 라운드 전 확정되지 않을 것(역전 가능성 상시 유지). ③ 무지성 인기 베팅의 기대 수익률 &lt; 0. ④ 평균 게임당 역전 서사 2회 이상.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 17 ----------\n`<section id=\"s18\"><div class=\"sec-head\"><div class=\"sec-num\">18<\u002Fdiv>\n<div><h2>놀아조라 연동<\u002Fh2><div class=\"sub\">Nolazora Integration<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">놀아조라의 Room 기반 멀티플레이 구조 위에서 동작합니다. 한 명의 Player View가 Display Mode를 겸하는 방식으로, 별도 하드웨어 없이 \"다 함께 보는 화면 + 각자의 폰\"을 구현합니다.<\u002Fp>\n<div class=\"grid g3\">\n  <div class=\"panel\"><h3>▶ Room<\u002Fh3><p>호스트가 방 생성 → 참가자 입장(2~8명). 방에는 게임 상태(라운드·트랙·날씨·순위·베팅·Chip)가 하나의 권위 있는 서버 상태로 존재. 모든 클라이언트는 이 상태를 구독.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ Display Mode<\u002Fh3><p>참가자 중 한 명이 Display Mode 지정. 큰 화면에 레이스 뷰·순위·이벤트를 렌더. 개인 베팅 UI는 오버레이로 축소. 곧 \"중계 클라이언트\"이자 동시에 플레이어.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ Player Mode<\u002Fh3><p>각자의 모바일에서 베팅·Contract·라이브 베팅을 조작. Display와 동일한 서버 상태를 구독하되, 렌더는 개인 조작 중심으로 경량화.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\"><h3>▶ Socket 구조 (권위 서버 모델)<\u002Fh3>\n<div class=\"flow\"><div class=\"flow-row\">\n  <div class=\"flow-node start\"><span class=\"t\">CLIENTS<\u002Fspan><span class=\"d\">Display + Players (구독)<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">SOCKET<\u002Fspan><span class=\"d\">양방향 이벤트 채널<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node end\"><span class=\"t\">GAME SERVER<\u002Fspan><span class=\"d\">권위 상태·시뮬레이션·시드<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"tbl-wrap\" style=\"margin-top:14px\"><table><thead><tr><th>방향<\u002Fth><th>이벤트<\u002Fth><th>페이로드<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>C → S<\u002Ftd><td><b>place_bet<\u002Fb><\u002Ftd><td>{playerId, charId, type, amount}<\u002Ftd><\u002Ftr>\n<tr><td>C → S<\u002Ftd><td><b>place_live_bet<\u002Fb><\u002Ftd><td>{playerId, charId, checkpoint, amount}<\u002Ftd><\u002Ftr>\n<tr><td>C → S<\u002Ftd><td><b>select_contract<\u002Fb><\u002Ftd><td>{playerId, contractId}<\u002Ftd><\u002Ftr>\n<tr><td>S → C<\u002Ftd><td><b>round_setup<\u002Fb><\u002Ftd><td>{round, track, weather, racers[], odds[], contractChoices[]}<\u002Ftd><\u002Ftr>\n<tr><td>S → C<\u002Ftd><td><b>race_tick<\u002Fb><\u002Ftd><td>{t, positions[], rank[], events[]} (레이스 진행 프레임)<\u002Ftd><\u002Ftr>\n<tr><td>S → C<\u002Ftd><td><b>checkpoint<\u002Fb><\u002Ftd><td>{cp, rank[], liveOdds[], liveOpen:true}<\u002Ftd><\u002Ftr>\n<tr><td>S → C<\u002Ftd><td><b>round_result<\u002Fb><\u002Ftd><td>{finalRank[], payouts[], contractResults[], chips[]}<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p class=\"muted\">레이스 시뮬레이션은 서버가 시드 기반으로 계산해 결과를 확정하고, 클라이언트에는 진행 프레임(race_tick)만 스트리밍 → 치팅 불가·전원 동기화. 재접속 시 현재 상태 스냅샷 재전송.<\u002Fp><\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 18 ----------\n`<section id=\"s19\"><div class=\"sec-head\"><div class=\"sec-num\">19<\u002Fdiv>\n<div><h2>개발 가이드<\u002Fh2><div class=\"sub\">Development Guide<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">웹 기반 실시간 멀티플레이에 최적화된 스택을 추천합니다.<\u002Fp>\n<div class=\"tbl-wrap\"><table><thead><tr><th>영역<\u002Fth><th>추천 기술<\u002Fth><th>이유<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>프레임워크<\u002Ftd><td><b>Next.js (React)<\u002Fb><\u002Ftd><td>SSR·라우팅·API Route로 방/매치메이킹 처리. 놀아조라 웹 생태계 정합.<\u002Ftd><\u002Ftr>\n<tr><td>렌더링<\u002Ftd><td><b>PixiJS<\u002Fb><\u002Ftd><td>WebGL 2D 스프라이트 렌더. 픽셀 레이스·파티클 대량 처리에 최적.<\u002Ftd><\u002Ftr>\n<tr><td>애니메이션<\u002Ftd><td><b>GSAP<\u002Fb><\u002Ftd><td>타임라인 기반 UI 모션(카드 플립·카운트업·카메라 팬).<\u002Ftd><\u002Ftr>\n<tr><td>사운드<\u002Ftd><td><b>Howler.js<\u002Fb><\u002Ftd><td>채널 분리·스프라이트 오디오·모바일 오토플레이 대응.<\u002Ftd><\u002Ftr>\n<tr><td>상태 관리<\u002Ftd><td><b>Zustand<\u002Fb><\u002Ftd><td>가벼운 전역 store. 소켓 이벤트 → store 반영 → 컴포넌트 구독 패턴.<\u002Ftd><\u002Ftr>\n<tr><td>실시간<\u002Ftd><td>Socket.IO / WebSocket<\u002Ftd><td>권위 서버와 양방향 이벤트. 재연결·룸 네이티브 지원.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<div class=\"grid g2\">\n  <div class=\"panel\"><h3>▶ 폴더 구조 (제안)<\u002Fh3>\n  <div class=\"formula\" style=\"font-size:10px;color:var(--info);line-height:1.8\">\n/src<br/>\n ├─ /app <span style=\"color:var(--muted)\">라우트(lobby, room, play)<\u002Fspan><br/>\n ├─ /game<br/>\n │   ├─ /engine <span style=\"color:var(--muted)\">시뮬레이션·시드·밸런스<\u002Fspan><br/>\n │   ├─ /render <span style=\"color:var(--muted)\">PixiJS 씬·스프라이트<\u002Fspan><br/>\n │   └─ /data <span style=\"color:var(--muted)\">chars·tracks·weather·events·contracts<\u002Fspan><br/>\n ├─ /ui <span style=\"color:var(--muted)\">Player/Display 컴포넌트<\u002Fspan><br/>\n ├─ /store <span style=\"color:var(--muted)\">Zustand slices<\u002Fspan><br/>\n ├─ /net <span style=\"color:var(--muted)\">socket client·events<\u002Fspan><br/>\n └─ /audio <span style=\"color:var(--muted)\">Howler manager<\u002Fspan>\n  <\u002Fdiv><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 아키텍처 · 상태 관리<\u002Fh3>\n  <p><b>권위 서버 + 얇은 클라이언트.<\u002Fb> 서버가 레이스를 시뮬레이션·판정하고, 클라이언트는 race_tick을 받아 렌더만 담당(예측 보간 optional).<\u002Fp>\n  <p>Zustand store를 <code>game / bet / player / ui<\u002Fcode> 슬라이스로 분리. 소켓 미들웨어가 수신 이벤트를 액션으로 디스패치. Display/Player는 같은 store를 다른 셀렉터로 구독.<\u002Fp>\n  <p class=\"muted\">데이터(캐릭터·트랙·이벤트 등)는 순수 JSON으로 분리해 밸런싱을 코드 수정 없이 튜닝.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 19 ----------\n`<section id=\"s20\"><div class=\"sec-head\"><div class=\"sec-num\">20<\u002Fdiv>\n<div><h2>MVP<\u002Fh2><div class=\"sub\">Minimum Viable Product<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">가장 먼저 \"베팅→레이스→정산\"의 코어 루프가 재미있는지를 검증합니다. 화려함보다 <b>루프의 손맛<\u002Fb>이 우선입니다.<\u002Fp>\n<div class=\"tbl-wrap\"><table><thead><tr><th>우선순위<\u002Fth><th>범위<\u002Fth><th>포함<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td><span class=\"num\">P0<\u002Fspan> 코어<\u002Ftd><td>1라운드 사전 베팅 + 레이스 + 정산<\u002Ftd><td>캐릭터 6명, 트랙 3종, 날씨 3종, 이벤트 15종, 사전 베팅(단승/복승), 결정론 시뮬레이션.<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"num\">P1<\u002Fspan> 핵심 재미<\u002Ftd><td>라이브 베팅 + Contract<\u002Ftd><td>하위권 라이브 베팅, Contract Common~Rare 12종, 4라운드 풀 게임, 배당 계산.<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"num\">P2<\u002Fspan> 완성도<\u002Ftd><td>전체 콘텐츠 + 연출<\u002Ftd><td>캐릭터 12·트랙 10·날씨 10·이벤트 54·Contract 32, GSAP 연출, Howler 사운드, Display Mode.<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"num\">P3<\u002Fspan> 플랫폼<\u002Ftd><td>놀아조라 완전 연동<\u002Ftd><td>Room·재접속·매치 로그·관전 최적화·성능 튜닝.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<div class=\"panel\"><h3>▶ 로드맵<\u002Fh3>\n<div class=\"flow\"><div class=\"flow-row\">\n  <div class=\"flow-node start\"><span class=\"t\">M1<\u002Fspan><span class=\"d\">P0 코어 루프 프로토타입 · 재미 검증<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">M2<\u002Fspan><span class=\"d\">P1 라이브 베팅·Contract · 4라운드<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node\"><span class=\"t\">M3<\u002Fspan><span class=\"d\">P2 전체 콘텐츠·연출·사운드<\u002Fspan><\u002Fdiv>\n  <div class=\"flow-node end\"><span class=\"t\">M4<\u002Fspan><span class=\"d\">P3 놀아조라 연동 · 정식 출시<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"note info\"><b>검증 질문(M1 게이트).<\u002Fb> \"조건을 분석해 저평가 캐릭터를 찾는 행위가 재미있는가?\" 여기서 YES가 나와야 다음 단계로 진행합니다.<\u002Fdiv>\n<\u002Fsection>`,\n\n// ---------- 20 ----------\n`<section id=\"s21\"><div class=\"sec-head\"><div class=\"sec-num\">21<\u002Fdiv>\n<div><h2>향후 확장<\u002Fh2><div class=\"sub\">Future Expansion<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"lead\">코어가 검증되면 콘텐츠와 메타를 확장해 반복 플레이 동기를 키웁니다.<\u002Fp>\n<div class=\"grid g3\">\n  <div class=\"panel\"><h3>▶ 콘텐츠 확장<\u002Fh3><div class=\"chips\"><span class=\"chip\">신규 캐릭터<\u002Fspan><span class=\"chip\">신규 트랙<\u002Fspan><span class=\"chip\">신규 Contract<\u002Fspan><span class=\"chip\">신규 날씨·이벤트<\u002Fspan><\u002Fdiv><p class=\"muted\" style=\"margin-top:10px;font-size:16px\">데이터 분리 구조 덕에 밸런스만 맞추면 저비용 추가 가능.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 메타 시스템<\u002Fh3><div class=\"chips\"><span class=\"chip gold\">시즌 시스템<\u002Fspan><span class=\"chip gold\">랭킹<\u002Fspan><span class=\"chip\">배틀패스<\u002Fspan><span class=\"chip\">도전 과제<\u002Fspan><\u002Fdiv><p class=\"muted\" style=\"margin-top:10px;font-size:16px\">시즌별 트랙 로테이션·리더보드로 지속 동기 부여.<\u002Fp><\u002Fdiv>\n  <div class=\"panel\"><h3>▶ 관전·소셜<\u002Fh3><div class=\"chips\"><span class=\"chip info\">AI 해설<\u002Fspan><span class=\"chip info\">관전 모드<\u002Fspan><span class=\"chip\">리플레이 공유<\u002Fspan><span class=\"chip\">이모트·반응<\u002Fspan><\u002Fdiv><p class=\"muted\" style=\"margin-top:10px;font-size:16px\">결정론 시드 덕에 리플레이·해설·검증이 자연스럽게 지원됨.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\"><b>AI 해설.<\u002Fb> 결정론 시뮬레이션 로그를 언어 모델에 넣어 실시간 캐스터 멘트 생성 — \"머드가 언더독 발동! 8위에서 3위로!\" 같은 중계로 관전 몰입을 극대화하는 킬러 확장 기능.<\u002Fdiv>\n<hr class=\"divider\" />\n<p class=\"muted\" style=\"text-align:center\">— END OF DOCUMENT · RACE GAME GDD v1.0 · 놀아조라 게임 스튜디오 —<\u002Fp>\n<\u002Fsection>`,\n];\n\n/* =================================================================\n   RENDER\n   ================================================================= */\ndocument.getElementById('main').innerHTML = sections.join('');\n\n// Contracts\nfunction renderContracts(filter){\n  const list = filter==='all'?CONTRACTS:CONTRACTS.filter(c=>c.r===filter);\n  document.getElementById('cGrid').innerHTML = list.map(c=>`\n    <div class=\"ccard\">\n      <div class=\"top\"><h4>${c.name}<\u002Fh4><span class=\"rar ${c.r}\">${rarName[c.r]}<\u002Fspan><\u002Fdiv>\n      <div class=\"desc\">${c.d}<\u002Fdiv>\n      <div class=\"rowline\"><span class=\"l\">성공<\u002Fspan><span style=\"text-align:right;color:var(--good)\">${c.ok}<\u002Fspan><\u002Fdiv>\n      <div class=\"rowline\"><span class=\"l\">실패<\u002Fspan><span style=\"text-align:right;color:var(--bad)\">${c.no}<\u002Fspan><\u002Fdiv>\n      <div class=\"rowline\"><span class=\"rew\">▲ ${c.rew}<\u002Fspan><span class=\"pen\">▼ ${c.pen}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\nrenderContracts('all');\ndocument.querySelectorAll('#cFilter .fbtn').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#cFilter .fbtn').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); renderContracts(b.dataset.r);\n}));\n\n// Characters\ndocument.getElementById('charGrid').innerHTML = CHARS.map(c=>`\n  <div class=\"charcard\">\n    <div class=\"avatar\" style=\"background:${c.bg}\">${c.emoji}<\u002Fdiv>\n    <h4>${c.name} <span style=\"color:var(--muted);font-size:9px\">${c.en}<\u002Fspan><\u002Fh4>\n    <div class=\"role\">${c.role}<\u002Fdiv>\n    <p class=\"muted\" style=\"font-size:15px;margin:0 0 10px\">${c.concept}<\u002Fp>\n    ${statBars(c.stats)}\n    <div style=\"margin-top:10px;font-size:16px\">\n      <div><span class=\"chip good\" style=\"font-size:8px\">PASSIVE<\u002Fspan> ${c.passive}<\u002Fdiv>\n      <div style=\"margin-top:6px\"><span class=\"chip info\" style=\"font-size:8px\">ACTIVE<\u002Fspan> ${c.active}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chips\" style=\"margin-top:10px\">\n      <span class=\"chip gold\">🏁 ${c.track}<\u002Fspan><span class=\"chip\">☁️ ${c.weather}<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;margin:10px 0 0\"><span style=\"color:var(--bad)\">약점:<\u002Fspan> <span class=\"muted\">${c.weak}<\u002Fspan><\u002Fp>\n    <p style=\"font-size:15px;margin:6px 0 0\"><span style=\"color:var(--gold)\">스타일:<\u002Fspan> <span class=\"muted\">${c.style}<\u002Fspan><\u002Fp>\n  <\u002Fdiv>`).join('');\n\n// Character table\ndocument.querySelector('#charTable tbody').innerHTML = CHARS.map(c=>`\n  <tr><td><b>${c.emoji} ${c.name}<\u002Fb><\u002Ftd><td>${c.role}<\u002Ftd>\n  <td class=\"num\">${c.stats.SPD}<\u002Ftd><td class=\"num\">${c.stats.ACC}<\u002Ftd><td class=\"num\">${c.stats.STA}<\u002Ftd>\n  <td class=\"num\">${c.stats.LCK}<\u002Ftd><td class=\"num\">${c.stats.TEC}<\u002Ftd>\n  <td>${c.track}<\u002Ftd><td>${c.weather}<\u002Ftd><td class=\"muted\">${c.weak}<\u002Ftd><\u002Ftr>`).join('');\n\n// Tracks\ndocument.getElementById('trackGrid').innerHTML = TRACKS.map(t=>`\n  <div class=\"panel\" style=\"margin:0\">\n    <h3 style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:26px\">${t.emoji}<\u002Fspan> ${t.name}<\u002Fh3>\n    <div class=\"chips\" style=\"margin-bottom:10px\"><span class=\"chip info\">${t.dist}<\u002Fspan><span class=\"chip\">${t.terrain}<\u002Fspan><\u002Fdiv>\n    <p style=\"font-size:17px;margin:0 0 8px\">${t.feat}<\u002Fp>\n    <p style=\"font-size:15px;margin:0\"><span style=\"color:var(--gold)\">유리:<\u002Fspan> <span class=\"muted\">${t.fav}<\u002Fspan><\u002Fp>\n  <\u002Fdiv>`).join('');\n\n// Weather\ndocument.querySelector('#weatherTable tbody').innerHTML = WEATHER.map(w=>`\n  <tr><td><b>${w.emoji} ${w.name}<\u002Fb><\u002Ftd><td><span class=\"chip\" style=\"font-size:8px\">${w.rar}<\u002Fspan><\u002Ftd><td>${w.eff}<\u002Ftd><\u002Ftr>`).join('');\n\n// Events\nfunction renderEvents(filter){\n  const list = filter==='all'?EVENTS:EVENTS.filter(e=>e.c===filter);\n  document.querySelector('#eventTable tbody').innerHTML = list.map(e=>`\n    <tr><td><span class=\"chip ${evColor[e.c]}\" style=\"font-size:8px\">${evName[e.c]}<\u002Fspan><\u002Ftd>\n    <td><b>${e.name}<\u002Fb><\u002Ftd><td>${e.eff}<\u002Ftd><td class=\"muted\">${e.cond}<\u002Ftd><\u002Ftr>`).join('');\n}\nrenderEvents('all');\ndocument.querySelectorAll('#eFilter .fbtn').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#eFilter .fbtn').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on'); renderEvents(b.dataset.c);\n}));\n\n/* ===== TOC scrollspy + mobile menu ===== */\nconst links = [...document.querySelectorAll('.toc a')];\nconst secs = links.map(a=>document.querySelector(a.getAttribute('href')));\nconst spy = new IntersectionObserver(entries=>{\n  entries.forEach(en=>{\n    if(en.isIntersecting){\n      const i = secs.indexOf(en.target);\n      links.forEach(l=>l.classList.remove('active'));\n      if(links[i]) links[i].classList.add('active');\n    }\n  });\n},{rootMargin:'-45% 0px -50% 0px',threshold:0});\nsecs.forEach(s=>s&&spy.observe(s));\n\nconst toc = document.getElementById('toc');\ndocument.getElementById('menuBtn').addEventListener('click',()=>toc.classList.toggle('open'));\nlinks.forEach(l=>l.addEventListener('click',()=>toc.classList.remove('open')));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
