  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

110%, rgba(21,34,63,.5), transparent 60%),\n    var(--bg);\n  color:var(--ink);\n  font-family:'VT323','Galmuri11',ui-monospace,monospace;\n  font-size:20px;\n  line-height:1.5;\n  letter-spacing:.3px;\n  -webkit-font-smoothing:none;\n  image-rendering:pixelated;\n}\n::selection{background:var(--gold);color:var(--black)}\na{color:var(--gold);text-decoration:none}\nh1,h2,h3,h4,.pix{font-family:'Press Start 2P',monospace;letter-spacing:0;line-height:1.35;-webkit-font-smoothing:none}\n\n/* Scrollbar */\n::-webkit-scrollbar{width:14px;height:14px}\n::-webkit-scrollbar-track{background:var(--bg2)}\n::-webkit-scrollbar-thumb{background:var(--purple-deep);border:3px solid var(--bg2)}\n::-webkit-scrollbar-thumb:hover{background:var(--purple)}\n\n/* ===== Layout ===== */\n.topbar{\n  position:sticky;top:0;z-index:50;\n  display:flex;align-items:center;gap:18px;\n  padding:16px 22px;\n  background:linear-gradient(180deg,#120f28,#0c0a1c);\n  border-bottom:4px solid var(--black);\n  box-shadow:0 4px 0 0 var(--purple-deep),0 8px 0 0 var(--black);\n}\n.logo-badge{\n  width:46px;height:46px;flex:none;\n  background:linear-gradient(135deg,var(--gold),var(--gold-dim));\n  color:var(--black);\n  display:grid;place-items:center;\n  font-family:'Press Start 2P';font-size:20px;\n  clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px));\n  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.4);\n}\n.topbar .title h1{font-size:18px;margin:0;color:var(--gold);text-shadow:2px 2px 0 var(--black)}\n.topbar .title p{margin:4px 0 0;font-size:16px;color:var(--muted);font-family:'VT323'}\n.topbar .spacer{flex:1}\n.topbar .meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}\n.tag{\n  font-family:'Press Start 2P';font-size:9px;padding:8px 10px;\n  background:var(--navy);border:2px solid var(--navy2);color:var(--info);\n  clip-path:polygon(0 6px,6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);\n}\n.menu-btn{display:none}\n\n.layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}\n\n/* ===== TOC ===== */\n.toc{\n  position:sticky;top:96px;\n  width:290px;flex:none;\n  height:calc(100vh - 96px);\n  overflow-y:auto;\n  padding:20px 14px 60px;\n}\n.toc-title{font-family:'Press Start 2P';font-size:11px;color:var(--gold);margin:0 0 14px;padding:0 8px}\n.toc ol{list-style:none;margin:0;padding:0;counter-reset:toc}\n.toc li{counter-increment:toc}\n.toc a{\n  display:flex;gap:10px;align-items:baseline;\n  padding:9px 10px;margin-bottom:3px;\n  color:var(--muted);font-size:18px;\n  border-left:4px solid transparent;\n  transition:all .08s steps(2);\n}\n.toc a::before{\n  content:counter(toc,decimal-leading-zero);\n  font-family:'Press Start 2P';font-size:9px;color:var(--muted2);flex:none;\n}\n.toc a:hover{background:var(--panel);color:var(--ink);border-left-color:var(--purple)}\n.toc a.active{background:var(--panel2);color:var(--gold);border-left-color:var(--gold)}\n.toc a.active::before{color:var(--gold)}\n\n/* ===== Main ===== */\nmain{flex:1;min-width:0;padding:26px 30px 120px;max-width:1100px}\nsection{margin-bottom:64px;scroll-margin-top:110px}\n.sec-head{display:flex;align-items:center;gap:16px;margin:0 0 22px}\n.sec-num{\n  font-family:'Press Start 2P';font-size:14px;color:var(--black);\n  background:linear-gradient(135deg,var(--purple),var(--purple-dim));\n  padding:12px 12px;flex:none;\n  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.25),var(--shadow);\n  clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px));\n}\n.sec-head h2{font-size:20px;margin:0;color:var(--gold);text-shadow:2px 2px 0 var(--black)}\n.sec-head .sub{font-family:'VT323';font-size:17px;color:var(--muted);margin-top:2px}\n.lead{font-size:21px;color:var(--ink);margin:0 0 20px;max-width:70ch;text-wrap:pretty}\n.muted{color:var(--muted)}\n\n/* Pixel panel / card */\n.panel{\n  background:linear-gradient(180deg,var(--panel),var(--bg2));\n  border:3px solid var(--black);\n  padding:20px 22px;margin:0 0 18px;\n  box-shadow:inset 0 0 0 2px var(--line),var(--shadow);\n  clip-path:polygon(0 var(--notch),var(--notch) 0,calc(100% - var(--notch)) 0,100% var(--notch),100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,var(--notch) 100%,0 calc(100% - var(--notch)));\n}\n.panel h3{font-size:14px;margin:0 0 14px;color:var(--info)}\n.panel h4{font-size:12px;margin:18px 0 10px;color:var(--gold)}\n.grid{display:grid;gap:16px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n\n/* Stat / mini card */\n.mini{\n  background:var(--panel2);border:2px solid var(--line);\n  padding:14px 16px;\n  box-shadow:inset 2px 2px 0 rgba(255,255,255,.05),3px 3px 0 rgba(0,0,0,.4);\n}\n.mini .k{font-family:'Press Start 2P';font-size:9px;color:var(--muted);display:block;margin-bottom:8px}\n.mini .v{font-family:'Press Start 2P';font-size:16px;color:var(--gold)}\n.mini .v small{font-family:'VT323';font-size:16px;color:var(--muted);letter-spacing:0}\n\n/* Tables */\n.tbl-wrap{overflow-x:auto;border:3px solid var(--black);box-shadow:var(--shadow);margin:0 0 18px}\ntable{border-collapse:collapse;width:100%;min-width:600px;background:var(--bg2)}\nth,td{padding:11px 13px;text-align:left;border:1px solid var(--line);font-size:18px;vertical-align:top}\nth{\n  font-family:'Press Start 2P';font-size:9px;color:var(--gold);\n  background:var(--navy);position:sticky;top:0;letter-spacing:0;\n}\ntbody tr:nth-child(even){background:rgba(122,92,240,.05)}\ntbody tr:hover{background:rgba(245,197,66,.07)}\ntd b{color:var(--ink)}\n.num{font-family:'Press Start 2P';font-size:11px;color:var(--info)}\n\n/* Chips / badges */\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chip{\n  font-family:'Press Start 2P';font-size:9px;padding:7px 9px;\n  background:var(--navy);border:2px solid var(--navy2);color:var(--ink);\n}\n.chip.gold{background:rgba(245,197,66,.15);border-color:var(--gold-dim);color:var(--gold)}\n.chip.good{background:rgba(79,216,138,.13);border-color:#2e7d54;color:var(--good)}\n.chip.bad{background:rgba(255,93,108,.13);border-color:#8a3540;color:var(--bad)}\n.chip.info{background:rgba(87,199,255,.12);border-color:#2b6c8a;color:var(--info)}\n\n.rar{font-family:'Press Start 2P';font-size:9px;padding:6px 8px;border:2px solid}\n.rar.common{color:var(--common);border-color:var(--common);background:rgba(154,162,184,.1)}\n.rar.rare{color:var(--rare);border-color:var(--rare);background:rgba(74,163,255,.12)}\n.rar.epic{color:var(--epic);border-color:var(--epic);background:rgba(181,107,255,.12)}\n.rar.legendary{color:var(--legendary);border-color:var(--legendary);background:rgba(245,197,66,.12)}\n\n/* Flow chart */\n.flow{display:flex;flex-direction:column;gap:0;align-items:stretch}\n.flow-row{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}\n.flow-node{\n  flex:1;min-width:130px;\n  background:var(--panel2);border:3px solid var(--black);\n  box-shadow:inset 0 0 0 2px var(--purple-deep),4px 4px 0 rgba(0,0,0,.5);\n  padding:14px;text-align:center;\n  clip-path:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px));\n}\n.flow-node .t{font-family:'Press Start 2P';font-size:10px;color:var(--gold);display:block;margin-bottom:8px}\n.flow-node .d{font-size:16px;color:var(--muted)}\n.flow-arrow{text-align:center;color:var(--purple);font-family:'Press Start 2P';font-size:14px;padding:8px 0}\n.flow-node.start{box-shadow:inset 0 0 0 2px var(--gold-dim),4px 4px 0 rgba(0,0,0,.5)}\n.flow-node.start .t{color:var(--gold)}\n.flow-node.end{box-shadow:inset 0 0 0 2px #2e7d54,4px 4px 0 rgba(0,0,0,.5)}\n\n/* Callout */\n.note{\n  border-left:6px solid var(--gold);background:rgba(245,197,66,.07);\n  padding:14px 18px;margin:0 0 18px;font-size:19px;\n}\n.note.info{border-color:var(--info);background:rgba(87,199,255,.07)}\n.note.warn{border-color:var(--bad);background:rgba(255,93,108,.07)}\n.note.good{border-color:var(--good);background:rgba(79,216,138,.07)}\n.note b{color:var(--gold)}\n\n/* Progress bars for stats */\n.stat{display:flex;align-items:center;gap:10px;margin:6px 0}\n.stat .lbl{width:74px;font-family:'Press Start 2P';font-size:8px;color:var(--muted);flex:none}\n.bar{flex:1;height:14px;background:var(--black);border:2px solid var(--line);position:relative;padding:2px}\n.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));\n  background-size:6px 100%;image-rendering:pixelated}\n.stat .val{width:34px;text-align:right;font-family:'Press Start 2P';font-size:9px;color:var(--gold)}\n\n/* Wireframe */\n.wire{\n  background:\n    linear-gradient(rgba(122,92,240,.06) 1px,transparent 1px),\n    linear-gradient(90deg,rgba(122,92,240,.06) 1px,transparent 1px),\n    var(--bg2);\n  background-size:24px 24px,24px 24px,100% 100%;\n  border:3px dashed var(--purple-dim);\n  padding:16px;margin:0 0 18px;\n}\n.wire-label{font-family:'Press Start 2P';font-size:9px;color:var(--purple);margin-bottom:12px}\n.wbox{\n  border:2px solid var(--muted2);background:rgba(24,20,51,.7);\n  padding:12px;text-align:center;color:var(--muted);font-size:16px;\n  display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:44px;\n}\n.wbox b{font-family:'Press Start 2P';font-size:9px;color:var(--ink);letter-spacing:0}\n.wbox.accent{border-color:var(--gold);color:var(--gold)}\n.wbox.p{border-color:var(--purple);color:var(--purple)}\n.wrow{display:flex;gap:10px;margin-bottom:10px}\n.wrow>*{flex:1}\n\n/* character card */\n.charcard{\n  background:linear-gradient(180deg,var(--panel2),var(--bg2));\n  border:3px solid var(--black);\n  box-shadow:inset 0 0 0 2px var(--line),var(--shadow);\n  padding:16px;\n}\n.charcard .avatar{\n  width:100%;aspect-ratio:1;border:3px solid var(--black);margin-bottom:12px;\n  display:grid;place-items:center;font-size:52px;\n  image-rendering:pixelated;position:relative;overflow:hidden;\n}\n.charcard .avatar::after{content:'';position:absolute;inset:0;\n  background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.12) 50%);background-size:100% 4px;pointer-events:none}\n.charcard h4{font-family:'Press Start 2P';font-size:12px;color:var(--gold);margin:0 0 4px}\n.charcard .role{font-size:16px;color:var(--info);margin-bottom:10px}\n\n/* contract card */\n.ccard{\n  background:linear-gradient(180deg,var(--panel2),var(--bg2));\n  border:3px solid var(--black);padding:14px 15px;position:relative;\n  box-shadow:inset 0 0 0 2px var(--line),4px 4px 0 rgba(0,0,0,.5);\n  display:flex;flex-direction:column;gap:8px;\n}\n.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}\n.ccard h4{font-family:'Press Start 2P';font-size:11px;margin:0;color:var(--ink);line-height:1.4}\n.ccard .desc{font-size:17px;color:var(--muted)}\n.ccard .rowline{display:flex;justify-content:space-between;gap:8px;font-size:16px;border-top:1px dashed var(--line);padding-top:7px}\n.ccard .rowline .l{color:var(--muted2);font-family:'Press Start 2P';font-size:8px;padding-top:3px}\n.ccard .rowline .rew{color:var(--good);text-align:right}\n.ccard .rowline .pen{color:var(--bad);text-align:right}\n.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}\n.fbtn{\n  font-family:'Press Start 2P';font-size:9px;padding:9px 12px;cursor:pointer;\n  background:var(--navy);border:2px solid var(--navy2);color:var(--muted);\n}\n.fbtn:hover{color:var(--ink)}\n.fbtn.on{background:var(--purple-deep);border-color:var(--purple);color:var(--gold)}\n\n/* formula box */\n.formula{\n  font-family:'Press Start 2P';font-size:12px;color:var(--gold);\n  background:var(--black);border:2px solid var(--purple-deep);\n  padding:16px 18px;margin:12px 0;overflow-x:auto;line-height:2;\n}\n.formula .op{color:var(--purple)}\n.formula .var{color:var(--info)}\n\n.divider{height:4px;background:repeating-linear-gradient(90deg,var(--purple-deep) 0 8px,transparent 8px 16px);margin:40px 0;border:0}\n\n.footer{max-width:1100px;margin:40px auto 0;padding:24px 30px;border-top:4px solid var(--black);color:var(--muted2);font-size:16px}\n\n/* Responsive */\n@media(max-width:960px){\n  .toc{position:fixed;left:0;top:0;bottom:0;height:100vh;z-index:60;width:280px;\n    background:var(--bg);border-right:4px solid var(--black);transform:translateX(-105%);transition:transform .15s steps(3);padding-top:70px}\n  .toc.open{transform:translateX(0)}\n  .menu-btn{display:grid;place-items:center;width:44px;height:44px;flex:none;cursor:pointer;\n    background:var(--navy);border:2px solid var(--purple);color:var(--gold);font-family:'Press Start 2P';font-size:14px}\n  main{padding:18px 16px 100px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .topbar .meta{display:none}\n  .topbar .title h1{font-size:14px}\n}\n@media(min-width:961px){.charcards.g4{grid-template-columns:repeat(3,1fr)}}\n@media(max-width:620px){\n  body{font-size:19px}\n  .flow-row{flex-direction:column}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header class=\"topbar\">\n  <div class=\"menu-btn\" id=\"menuBtn\" aria-label=\"목차\">☰<\u002Fdiv>\n  <div class=\"logo-badge\">R<\u002Fdiv>\n  <div class=\"title\">\n    <h1>RACE GAME<\u002Fh1>\n    <p>Game Design Document · 놀아조라 Nolazora<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"spacer\"><\u002Fdiv>\n  <div class=\"meta\">\n    <span class=\"tag\">2~8 PLAYERS<\u002Fspan>\n    <span class=\"tag\">~15 MIN<\u002Fspan>\n    <span class=\"tag\">v1.0 GDD<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"layout\">\n  <nav class=\"toc\" id=\"toc\">\n    <div class=\"toc-title\">▶ CONTENTS<\u002Fdiv>\n    <ol>\n      <li><a href=\"#s1\">게임 개요<\u002Fa><\u002Fli>\n      <li><a href=\"#s2\">쉽게 즐기기 (접근성)<\u002Fa><\u002Fli>\n      <li><a href=\"#s3\">게임 진행<\u002Fa><\u002Fli>\n      <li><a href=\"#s4\">게임 룰<\u002Fa><\u002Fli>\n      <li><a href=\"#s5\">베팅 시스템<\u002Fa><\u002Fli>\n
